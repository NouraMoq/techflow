<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صانع المحتوى | Content Maker — NovaMetrics</title>
<meta name="description" content="صانع المحتوى من نوفاميتريكس — نظام تشغيل متكامل لإدارة محتوى المشاهير وصناع المحتوى وفرقهم ووكالاتهم.">
<meta name="theme-color" content="#4f46e5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3Eص%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">ص</div>
      <div class="brand-txt"><b>صانع المحتوى</b><span>نوفاميتريكس</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div style="padding:12px;border-top:1px solid var(--border)">
      <div class="switcher"><span class="faint">الدور:</span><select id="roleSwitch"></select></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:16px;height:16px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="بحث سريع..."></div>
      <button class="tb-btn" id="themeToggle" aria-label="المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:18px;height:18px"><path d="M20 14A8 8 0 0 1 10 4a7 7 0 1 0 10 10z"/></svg></button>
      <button class="tb-btn" aria-label="الإشعارات"><span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:18px;height:18px"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button>
      <div class="avatar" title="ليان القحطاني">ل</div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
