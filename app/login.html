<div class="auth-wrap">

    <p class="muted" style="font-size:12.5px;text-align:center">نموذج توضيحي — لا يتم إرسال أي بيانات. ليس لديك حساب؟ <a href="index.html" style="color:var(--primary-ink);font-weight:700">اطلب عرضًا تجريبيًا</a></p>
