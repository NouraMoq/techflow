/* السحب والإفلات بين الأعمدة */
let _dragTaskId=null;
function taskDragStart(ev,id){ _dragTaskId=id; try{ev.dataTransfer.setData('text/plain',id);ev.dataTransfer.effectAllowed='move';}catch(e){} setTimeout(()=>{const el=ev.target;if(el&&el.classList)el.classList.add('dragging');},0); }
function taskDragEnd(ev){ _dragTaskId=null; const el=ev.target; if(el&&el.classList)el.classList.remove('dragging'); $$('.kb-col').forEach(c=>c.classList.remove('drop-hover')); }
function taskDragOver(ev){ ev.preventDefault(); try{ev.dataTransfer.dropEffect='move';}catch(e){} ev.currentTarget.classList.add('drop-hover'); }
function taskDragLeave(ev){ ev.currentTarget.classList.remove('drop-hover'); }
function taskDrop(ev,status){
  ev.preventDefault(); ev.currentTarget.classList.remove('drop-hover');
  let id=_dragTaskId; try{id=ev.dataTransfer.getData('text/plain')||id;}catch(e){}
  const t=execTasks().find(x=>x.id===id); if(!t)return;
  if(t.status!==status){ t.status=status; t.order=Date.now(); t.updatedAt=Date.now(); saveExecutive(); }
  renderExecutive(view.params||{});
}
function openTaskModal(id,presetStatus){
  const tk=id?execTasks().find(x=>x.id===id):null;
  const users=state.users.filter(u=>u.role!=='pending');
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>${tk?t('ex_task_edit'):t('ex_task_new')}</h3><div class="m-sub">${t('ex_task_modalsub')}</div>
    <div class="field"><label>${t('ex_title')}</label><input id="tkTitle" maxlength="160" value="${tk?escapeHtml(tk.title):''}"></div>
    <div class="field"><label>${t('ex_desc')}</label><textarea id="tkDesc" rows="3">${tk?escapeHtml(tk.desc||''):''}</textarea></div>
    <div class="field"><label>${t('ex_status')}</label><select id="tkStatus">
      ${TASK_COLS.map(c=>`<option value="${c.k}" ${(tk&&tk.status===c.k)||(!tk&&(presetStatus||'todo')===c.k)?'selected':''}>${taskColLabel(c.k)}</option>`).join('')}
    </select></div>
    <div class="field"><label>${t('ex_priority')}</label><select id="tkPrio">
      ${Object.keys(TASK_PRIO).map(k=>`<option value="${k}" ${(tk&&tk.priority===k)||(!tk&&k==='normal')?'selected':''}>${prioLabel(k)}</option>`).join('')}
    </select></div>
    <div class="field"><label>${t('ex_assignee')}</label><select id="tkAssignee"><option value="">${t('ex_unassigned')}</option>
      ${users.map(u=>`<option value="${u.id}" ${tk&&tk.assigneeId===u.id?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}
    </select></div>
    <div class="field"><label>${t('ex_due')}</label><input id="tkDue" type="date" value="${tk&&tk.due?tk.due:''}"></div>
    <div class="modal-actions">
      ${tk?`<button class="btn" style="border-color:var(--rose);color:var(--rose);margin-inline-end:auto" onclick="delTask('${tk.id}')">${t('ex_del')}</button>`:''}
      <button class="btn primary" onclick="saveTask(${tk?`'${tk.id}'`:'null'})">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div>
  </div></div>`;
  setTimeout(()=>{const el=$('#tkTitle');if(el)el.focus();},0);
}
function saveTask(id){
  if(!canExec()) return toast(t('no_perm'));
  const title=$('#tkTitle').value.trim(); if(!title) return toast(isRTL()?'أدخل العنوان':'Enter a title');
  const rec={desc:$('#tkDesc').value.trim(),status:$('#tkStatus').value,priority:$('#tkPrio').value,assigneeId:$('#tkAssignee').value||null,due:$('#tkDue').value||''};
  _normExec();
  if(id){ const tk=execTasks().find(x=>x.id===id); if(!tk)return; Object.assign(tk,rec,{title,updatedAt:Date.now()}); toast(t('updated')); }
  else { state.executive.tasks.push({id:uid('task'),title,...rec,order:Date.now(),createdBy:session.userId,createdAt:Date.now(),updatedAt:Date.now()}); toast(t('added')); }
  saveExecutive(); closeModal(); renderExecutive(view.params||{});
}
function delTask(id){
  if(!canExec()) return toast(t('no_perm'));
  const tk=execTasks().find(x=>x.id===id); if(!tk)return;
  confirmBox(isRTL()?'حذف المهمة؟':'Delete task?',escapeHtml(tk.title||''),()=>{ state.executive.tasks=execTasks().filter(x=>x.id!==id); saveExecutive(); closeModal(); renderExecutive(view.params||{}); toast(t('deleted')); });
}

/* ---------- تبويب: الحسابات (القوائم المالية الأربع) ---------- */
function fmtMoney(n){ n=Math.round(Number(n)||0); const s=n.toLocaleString(curLang()==='en'?'en-US':'ar-SA-u-nu-latn'); return s+' '+TR('ر.س','SAR'); }
const signMoney=n=>(Number(n)>0?'+':'')+fmtMoney(n);
function _normFinance(){
  const e=state.executive; let f=e.finance;
  if(Array.isArray(f)){ // ترحيل الصيغة القديمة (إيراد/مصروف) إلى قائمة الدخل
    const income=f.map(x=>({id:x.id||uid('fl'),section:(x.kind==='revenue'?'revenue':'opex'),desc:x.desc||x.category||'',expected:Number(x.expected)||0,actual:Number(x.actual)||0,note:x.note||''}));
    f=e.finance={income,balance:[],cashflow:[],equity:[]};
  }
  if(!f||typeof f!=='object'){ f=e.finance={income:[],balance:[],cashflow:[],equity:[]}; }
  ['income','balance','cashflow','equity'].forEach(k=>{ if(!Array.isArray(f[k]))f[k]=[]; });
}
function finData(){ _normFinance(); return state.executive.finance; }
const finArr=k=>finData()[k]||[];
const finSum=(arr,key)=>arr.reduce((a,x)=>a+(Number(x[key])||0),0);
const FIN_TABS=[
  {k:'income',ar:'قائمة الدخل',en:'Income Statement'},
  {k:'balance',ar:'المركز المالي',en:'Balance Sheet'},
  {k:'cashflow',ar:'التدفقات النقدية',en:'Cash Flow'},
  {k:'equity',ar:'حقوق الملكية',en:'Equity Changes'},
  {k:'report',ar:'التقرير السنوي',en:'Annual Report'},
];
const INCOME_SECTIONS=[
  {k:'revenue',ar:'الإيرادات (صافي المبيعات)',en:'Revenue (Net Sales)',sign:1},
  {k:'cogs',ar:'تكلفة الإيرادات',en:'Cost of Revenue',sign:-1},
  {k:'opex',ar:'المصروفات التشغيلية',en:'Operating Expenses',sign:-1},
  {k:'other_income',ar:'إيرادات ومكاسب أخرى غير عادية',en:'Other (non-operating) Income',sign:1},
  {k:'other_expense',ar:'مصروفات وخسائر أخرى غير عادية',en:'Other (non-operating) Expenses',sign:-1},
];
const BAL_GROUPS=[
  {k:'assets_current',ar:'الأصول المتداولة',en:'Current Assets'},
  {k:'assets_noncurrent',ar:'الأصول غير المتداولة',en:'Non-current Assets'},
  {k:'liab_current',ar:'الالتزامات المتداولة',en:'Current Liabilities'},
  {k:'liab_noncurrent',ar:'الالتزامات طويلة الأجل',en:'Non-current Liabilities'},
  {k:'equity',ar:'حقوق الملكية',en:'Equity'},
];
const CF_ACTS=[
  {k:'operating',ar:'الأنشطة التشغيلية',en:'Operating Activities'},
  {k:'investing',ar:'الأنشطة الاستثمارية',en:'Investing Activities'},
  {k:'financing',ar:'الأنشطة التمويلية',en:'Financing Activities'},
];
let finStmt='income';
function setFinStmt(k){ finStmt=k; renderExecutive(view.params||{}); }
function execFinanceHTML(){
  _normFinance();
  const canEdit=canExec();
  const bar=`<div class="fin-stmt-tabs">${FIN_TABS.map(s=>`<button class="fin-stmt-tab ${finStmt===s.k?'active':''}" onclick="setFinStmt('${s.k}')">${TR(s.ar,s.en)}</button>`).join('')}</div>`;
  const addBtn=(canEdit&&finStmt!=='report')?`<button class="btn primary" onclick="openFinLine('${finStmt}')">${ICON_ADD}${TR('إضافة بند','Add line')}</button>`:'';
  const head=`<div class="no-print" style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
    <div><h3 style="margin:0">${TR('حسابات الشركة','Company Finance')}</h3><div class="ci-sub">${TR('القوائم المالية: الدخل، المركز المالي، التدفقات النقدية، وحقوق الملكية.','Financial statements: income, balance sheet, cash flow, and equity.')}</div></div>
    <div style="flex:1"></div>${addBtn}</div>`;
  const body=({income:incomeStatementHTML,balance:balanceSheetHTML,cashflow:cashFlowHTML,equity:equityStatementHTML,report:financeReportHTML}[finStmt]||incomeStatementHTML)();
  return head+bar+body;
}
/* قائمة الدخل متعددة المراحل (متوقع مقابل فعلي) */
function incomeStatementHTML(ro){
  const canEdit=canExec()&&!ro; const cols=canEdit?5:4;
  const secBlock=(secKey)=>{
    const sec=INCOME_SECTIONS.find(s=>s.k===secKey);
    const lines=finArr('income').filter(x=>x.section===secKey);
    const subE=finSum(lines,'expected'), subA=finSum(lines,'actual');
    let h=`<tr class="fs-sec"><td colspan="${cols}">${TR(sec.ar,sec.en)}</td></tr>`;
    lines.forEach(x=>{ const d=(Number(x.actual)||0)-(Number(x.expected)||0);
      const vc=sec.sign>0?(d>=0?'--green':'--rose'):(d<=0?'--green':'--rose');
      h+=`<tr><td class="fs-line">${escapeHtml(x.desc||'—')}${x.note?`<div class="ci-sub">${escapeHtml(x.note)}</div>`:''}</td>
        <td class="num">${fmtMoney(x.expected)}</td><td class="num" style="font-weight:600">${fmtMoney(x.actual)}</td>
        <td class="num" style="color:var(${vc})">${signMoney(d)}</td>
        ${canEdit?`<td class="fs-act"><button class="icon-btn ci-mini" title="${t('ex_edit')}" onclick="openFinLine('income','${x.id}')">${ICON_EDIT}</button><button class="icon-btn ci-mini" title="${t('ex_del')}" onclick="delFinLine('income','${x.id}')">${ICON_DEL}</button></td>`:''}</tr>`; });
    if(!lines.length) h+=`<tr><td colspan="${cols}" class="fs-empty">${TR('— لا بنود —','— no lines —')}</td></tr>`;
    h+=`<tr class="fs-sub"><td>${TR('الإجمالي','Subtotal')}</td><td class="num">${fmtMoney(subE)}</td><td class="num">${fmtMoney(subA)}</td><td></td>${canEdit?'<td></td>':''}</tr>`;
    return {h,subE,subA};
  };
  const rev=secBlock('revenue'),cogs=secBlock('cogs'),opex=secBlock('opex'),oi=secBlock('other_income'),oe=secBlock('other_expense');
  const grossE=rev.subE-cogs.subE, grossA=rev.subA-cogs.subA;
  const opE=grossE-opex.subE, opA=grossA-opex.subA;
  const netE=opE+oi.subE-oe.subE, netA=opA+oi.subA-oe.subA;
  const calc=(label,e,a,cls)=>`<tr class="${cls}"><td>${label}</td><td class="num">${fmtMoney(e)}</td><td class="num" style="font-weight:800">${fmtMoney(a)}</td><td class="num">${signMoney(a-e)}</td>${canEdit?'<td></td>':''}</tr>`;
  return `<div class="card panel" style="padding:0;overflow-x:auto"><table class="report-table fin-stmt-table">
    <thead><tr><th>${TR('البند','Item')}</th><th>${TR('المتوقع','Expected')}</th><th>${TR('الفعلي','Actual')}</th><th>${TR('الفرق','Variance')}</th>${canEdit?'<th></th>':''}</tr></thead>
    <tbody>
      ${rev.h}${cogs.h}
      ${calc(TR('مجمل الربح','Gross Profit'),grossE,grossA,'fs-calc')}
      ${opex.h}
      ${calc(TR('الدخل التشغيلي','Operating Income'),opE,opA,'fs-calc')}
      ${oi.h}${oe.h}
      ${calc(TR('صافي الدخل','Net Income'),netE,netA,'fs-net')}
    </tbody></table></div>
    <div class="ci-sub" style="margin-top:10px;text-align:center">${TR('قائمة الدخل متعددة المراحل — مقارنة المتوقع بالفعلي.','Multi-step income statement — expected vs actual.')}</div>`;
}
/* قائمة المركز المالي (الأصول = الالتزامات + حقوق الملكية) */
function balanceSheetHTML(ro){
  const canEdit=canExec()&&!ro; const cols=canEdit?3:2;
  const grpBlock=(gk)=>{ const g=BAL_GROUPS.find(x=>x.k===gk); const lines=finArr('balance').filter(x=>x.group===gk); const sub=finSum(lines,'amount');
    let h=`<tr class="fs-sec"><td colspan="${cols}">${TR(g.ar,g.en)}</td></tr>`;
    lines.forEach(x=>{ h+=`<tr><td class="fs-line">${escapeHtml(x.desc||'—')}${x.note?`<div class="ci-sub">${escapeHtml(x.note)}</div>`:''}</td><td class="num" style="font-weight:600">${fmtMoney(x.amount)}</td>${canEdit?`<td class="fs-act"><button class="icon-btn ci-mini" onclick="openFinLine('balance','${x.id}')">${ICON_EDIT}</button><button class="icon-btn ci-mini" onclick="delFinLine('balance','${x.id}')">${ICON_DEL}</button></td>`:''}</tr>`; });
    if(!lines.length) h+=`<tr><td colspan="${cols}" class="fs-empty">${TR('— لا بنود —','— no lines —')}</td></tr>`;
    h+=`<tr class="fs-sub"><td>${TR('الإجمالي','Subtotal')}</td><td class="num">${fmtMoney(sub)}</td>${canEdit?'<td></td>':''}</tr>`;
    return {h,sub};
  };
  const ac=grpBlock('assets_current'),anc=grpBlock('assets_noncurrent'),lc=grpBlock('liab_current'),lnc=grpBlock('liab_noncurrent'),eq=grpBlock('equity');
  const totA=ac.sub+anc.sub, totL=lc.sub+lnc.sub, totE=eq.sub, totLE=totL+totE, diff=totA-totLE, balanced=Math.abs(diff)<0.5;
  const calc=(label,v,cls)=>`<tr class="${cls}"><td>${label}</td><td class="num">${fmtMoney(v)}</td>${canEdit?'<td></td>':''}</tr>`;
  return `<div class="card panel" style="padding:0;overflow-x:auto"><table class="report-table fin-stmt-table">
    <thead><tr><th>${TR('البند','Item')}</th><th>${TR('المبلغ','Amount')}</th>${canEdit?'<th></th>':''}</tr></thead>
    <tbody>
      ${ac.h}${anc.h}${calc(TR('إجمالي الأصول','Total Assets'),totA,'fs-net')}
      ${lc.h}${lnc.h}${calc(TR('إجمالي الالتزامات','Total Liabilities'),totL,'fs-calc')}
      ${eq.h}${calc(TR('إجمالي حقوق الملكية','Total Equity'),totE,'fs-calc')}
      ${calc(TR('الالتزامات + حقوق الملكية','Liabilities + Equity'),totLE,'fs-net')}
    </tbody></table></div>
    <div class="fin-balcheck ${balanced?'ok':'err'}">${balanced?TR('✓ القائمة متوازنة: الأصول = الالتزامات + حقوق الملكية','✓ Balanced: Assets = Liabilities + Equity'):(TR('⚠ غير متوازنة — الفرق: ','⚠ Not balanced — difference: ')+fmtMoney(Math.abs(diff)))}</div>`;
}
/* قائمة التدفقات النقدية (تشغيلية/استثمارية/تمويلية) */
function cashFlowHTML(ro){
  const canEdit=canExec()&&!ro; const cols=canEdit?3:2;
  const actBlock=(ak)=>{ const g=CF_ACTS.find(x=>x.k===ak); const lines=finArr('cashflow').filter(x=>x.activity===ak); const sub=finSum(lines,'amount');
    let h=`<tr class="fs-sec"><td colspan="${cols}">${TR(g.ar,g.en)}</td></tr>`;
    lines.forEach(x=>{ const neg=(Number(x.amount)||0)<0; h+=`<tr><td class="fs-line">${escapeHtml(x.desc||'—')}${x.note?`<div class="ci-sub">${escapeHtml(x.note)}</div>`:''}</td><td class="num" style="font-weight:600;color:var(${neg?'--rose':'--green'})">${fmtMoney(x.amount)}</td>${canEdit?`<td class="fs-act"><button class="icon-btn ci-mini" onclick="openFinLine('cashflow','${x.id}')">${ICON_EDIT}</button><button class="icon-btn ci-mini" onclick="delFinLine('cashflow','${x.id}')">${ICON_DEL}</button></td>`:''}</tr>`; });
    if(!lines.length) h+=`<tr><td colspan="${cols}" class="fs-empty">${TR('— لا بنود —','— no lines —')}</td></tr>`;
    h+=`<tr class="fs-sub"><td>${TR('صافي النشاط','Net activity')}</td><td class="num" style="color:var(${sub>=0?'--green':'--rose'})">${fmtMoney(sub)}</td>${canEdit?'<td></td>':''}</tr>`;
    return {h,sub};
  };
  const op=actBlock('operating'),inv=actBlock('investing'),fin=actBlock('financing');
  const net=op.sub+inv.sub+fin.sub;
  return `<div class="card panel" style="padding:0;overflow-x:auto"><table class="report-table fin-stmt-table">
    <thead><tr><th>${TR('البند','Item')}</th><th>${TR('التدفق النقدي','Cash flow')}</th>${canEdit?'<th></th>':''}</tr></thead>
    <tbody>${op.h}${inv.h}${fin.h}
      <tr class="fs-net"><td>${TR('صافي التغيّر في النقد','Net Change in Cash')}</td><td class="num" style="color:var(${net>=0?'--green':'--rose'})">${fmtMoney(net)}</td>${canEdit?'<td></td>':''}</tr>
    </tbody></table></div>
    <div class="ci-sub" style="margin-top:10px;text-align:center">${TR('الموجب = تدفق داخل، والسالب = تدفق خارج.','Positive = inflow, negative = outflow.')}</div>`;
}
/* قائمة التغييرات في حقوق الملكية */
function equityStatementHTML(ro){
  const canEdit=canExec()&&!ro; const cols=canEdit?5:4;
  const lines=finArr('equity');
  const tO=finSum(lines,'opening'), tC=finSum(lines,'change'), tCl=tO+tC;
  let rows='';
  lines.forEach(x=>{ const cl=(Number(x.opening)||0)+(Number(x.change)||0);
    rows+=`<tr><td class="fs-line">${escapeHtml(x.desc||'—')}${x.note?`<div class="ci-sub">${escapeHtml(x.note)}</div>`:''}</td>
      <td class="num">${fmtMoney(x.opening)}</td><td class="num" style="color:var(${(Number(x.change)||0)>=0?'--green':'--rose'})">${signMoney(x.change)}</td>
      <td class="num" style="font-weight:700">${fmtMoney(cl)}</td>
      ${canEdit?`<td class="fs-act"><button class="icon-btn ci-mini" onclick="openFinLine('equity','${x.id}')">${ICON_EDIT}</button><button class="icon-btn ci-mini" onclick="delFinLine('equity','${x.id}')">${ICON_DEL}</button></td>`:''}</tr>`; });
  if(!lines.length) rows=`<tr><td colspan="${cols}" class="fs-empty" style="padding:24px">${TR('لا مكوّنات بعد — أضف رأس المال والأرباح المُبقاة والاحتياطيات.','No components yet — add capital, retained earnings and reserves.')}</td></tr>`;
  return `<div class="card panel" style="padding:0;overflow-x:auto"><table class="report-table fin-stmt-table">
    <thead><tr><th>${TR('المكوّن','Component')}</th><th>${TR('أول المدة','Opening')}</th><th>${TR('التغيّر','Change')}</th><th>${TR('آخر المدة','Closing')}</th>${canEdit?'<th></th>':''}</tr></thead>
    <tbody>${rows}
      <tr class="fs-net"><td>${TR('إجمالي حقوق الملكية','Total Equity')}</td><td class="num">${fmtMoney(tO)}</td><td class="num">${signMoney(tC)}</td><td class="num">${fmtMoney(tCl)}</td>${canEdit?'<td></td>':''}</tr>
    </tbody></table></div>`;
}
/* التقرير المالي السنوي — يجمع القوائم الأربع */
function financeReportHTML(){
  _normFinance();
  const year=new Date().getFullYear();
  const inc=finArr('income');
  const sec=(k,key)=>finSum(inc.filter(x=>x.section===k),key);
  const revA=sec('revenue','actual'), cogsA=sec('cogs','actual'), opexA=sec('opex','actual'), oiA=sec('other_income','actual'), oeA=sec('other_expense','actual');
  const netIncA=revA-cogsA-opexA+oiA-oeA;
  const totAssets=finSum(finArr('balance').filter(x=>String(x.group).startsWith('assets')),'amount');
  const netCash=finSum(finArr('cashflow'),'amount');
  const eqA=finArr('equity'); const totEq=finSum(eqA,'opening')+finSum(eqA,'change');
  const kpi=(label,val,color)=>`<div class="card" style="padding:15px 18px"><div class="ci-sub" style="margin-bottom:6px">${label}</div><div class="num" style="font-size:19px;font-weight:800;color:var(${color})">${fmtMoney(val)}</div></div>`;
  const dateLbl=new Date().toLocaleDateString(curLang()==='en'?'en-US':'ar-SA-u-nu-latn',{year:'numeric',month:'long',day:'numeric'});
  const rsec=(title,html)=>`<div class="fin-report-sec"><h3 class="fin-report-t">${title}</h3>${html}</div>`;
  return `
  <div class="card panel fin-report-head">
    <div class="nm-logo" style="--logo-h:36px" aria-label="NovaMetrics نوﭬاميتريكس"><img src="logo-wide.svg" alt="NovaMetrics نوﭬاميتريكس"></div>
    <div style="flex:1"></div>
    <div style="text-align:${isRTL()?'left':'right'}">
      <div style="font-weight:800;font-size:18px">${TR('التقرير المالي السنوي','Annual Financial Report')}</div>
      <div class="ci-sub">${TR('السنة','Year')} ${year} · ${TR('تاريخ الإصدار','Issued')} ${dateLbl}</div>
    </div>
    <button class="btn no-print" style="margin-inline-start:12px" onclick="window.print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>${TR('طباعة / حفظ PDF','Print / Save PDF')}</button>
  </div>
  <div class="rep-kpis">
    ${kpi(TR('الإيرادات (فعلي)','Revenue (actual)'),revA,'--green')}
    ${kpi(TR('صافي الدخل','Net Income'),netIncA,netIncA>=0?'--green':'--rose')}
    ${kpi(TR('إجمالي الأصول','Total Assets'),totAssets,'--primary')}
    ${kpi(TR('صافي التغيّر النقدي','Net Cash Change'),netCash,netCash>=0?'--green':'--rose')}
  </div>
  ${rsec(TR('أولًا: قائمة الدخل','1. Income Statement'),incomeStatementHTML(true))}

function saveFinLine(stmt,id){
  if(!canExec()) return toast(t('no_perm'));
  const gv=i=>($('#'+i)?.value||'');
  const desc=gv('flDesc').trim(), note=gv('flNote').trim();
  if(!desc) return toast(TR('أدخل اسم البند','Enter a line name'));
  const rec={desc,note,updatedAt:Date.now()};
  if(stmt==='income'){ rec.section=gv('flSection'); rec.expected=Math.max(0,Number(gv('flExp'))||0); rec.actual=Math.max(0,Number(gv('flAct'))||0); }
  else if(stmt==='balance'){ rec.group=gv('flGroup'); rec.amount=Math.max(0,Number(gv('flAmt'))||0); }
  else if(stmt==='cashflow'){ rec.activity=gv('flActv'); rec.amount=Number(gv('flAmt'))||0; }
  else { rec.opening=Number(gv('flOpen'))||0; rec.change=Number(gv('flChange'))||0; }
  _normFinance();
  const arr=state.executive.finance[stmt];
  if(id){ const x=arr.find(e=>e.id===id); if(!x)return; Object.assign(x,rec); toast(t('updated')); }
  else { arr.push({id:uid('fl'),...rec,createdBy:session.userId,createdAt:Date.now()}); toast(t('added')); }
  saveExecutive(); closeModal(); renderExecutive(view.params||{});
}
function delFinLine(stmt,id){
  if(!canExec()) return toast(t('no_perm'));
  const arr=finArr(stmt); const x=arr.find(e=>e.id===id); if(!x)return;
  confirmBox(TR('حذف البند؟','Delete line?'),escapeHtml(x.desc||''),()=>{ state.executive.finance[stmt]=arr.filter(e=>e.id!==id); saveExecutive(); closeModal(); renderExecutive(view.params||{}); toast(t('deleted')); });
}

function fileIconSVG(type,name){

    ? '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/>'
    : '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>';
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:24px;height:24px">${p}</svg>`;
}
// محتوى الملف (base64) يُحفظ في مجموعة منفصلة execFiles ليبقى مستند executive صغيرًا وسريع التحميل
async function uploadExecFiles(ev){
  if(!canExec()){ ev.target.value=''; return toast(t('no_perm')); }
  const cat=$('#execFileCat')?$('#execFileCat').value:'general';
  const files=[...ev.target.files]; ev.target.value=''; if(!files.length)return;
  for(const file of files){
    if(file.size>EXEC_FILE_MAX){ toast(isRTL()?`«${file.name}» أكبر من الحد المجاني (٧٢٠ كيلوبايت)`:`“${file.name}” exceeds the free limit (720 KB)`); continue; }
    try{
      toast((isRTL()?'جارٍ رفع ':'Uploading ')+file.name+'…');
      const dataUrl=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(file); });
      const id=uid('doc');
      await db.collection('execFiles').doc(id).set({dataUrl,name:file.name,type:file.type,size:file.size,uploadedBy:session.userId,uploadedAt:firebase.firestore.FieldValue.serverTimestamp()});
      state.executive.files.push({id,name:file.name,type:file.type,size:file.size,block:cat,uploadedBy:session.userId,uploadedAt:Date.now(),date:new Date().toISOString().slice(0,10)});
      await saveExecutive();
      if(view&&view.name==='executive') renderExecutive(view.params||{});
      toast((isRTL()?'تم رفع ':'Uploaded ')+file.name);
    }catch(e){ console.warn('exec upload failed',e); toast((isRTL()?'تعذّر رفع ':'Failed to upload ')+file.name); }
  }
}
async function downloadExecFile(id){
  const f=execFiles().find(x=>x.id===id); if(!f)return;
  try{
    toast(isRTL()?'جارٍ تجهيز الملف...':'Preparing file…');
    const doc=await db.collection('execFiles').doc(id).get();
    const d=doc.exists?doc.data():null;
    if(!d||!d.dataUrl) return toast(isRTL()?'محتوى الملف غير متوفر':'File content unavailable');
    const a=document.createElement('a'); a.href=d.dataUrl; a.download=f.name||'file';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ console.warn('download failed',e); toast(isRTL()?'تعذّر تحميل الملف':'Download failed'); }
}
// معاينة الملف داخل المنصة دون تنزيله

const PERM_LABELS={create_project:'إنشاء مشاريع',edit_stages:'تعديل المراحل',manage_users:'إدارة المستخدمين',assign_dev:'تعيين مطوّرين',view_all:'مشاهدة الكل',reports:'التقارير',stats:'الإحصائيات',settings:'الإعدادات',executive:'الإدارة التنفيذية',change_status:'تغيير الحالة',approve:'اعتماد المراحل',notes:'الملاحظات',update_progress:'تحديث التقدّم',checklist:'قوائم التحقق',upload:'رفع الملفات',request:'طلب الانتقال',view_own:'مشاريعه',review:'مراجعة الإنجاز',view_assigned:'المشاريع المكلّف بها'};
const PERM_LABELS_EN={create_project:'Create projects',edit_stages:'Edit stages',manage_users:'Manage users',assign_dev:'Assign developers',view_all:'View all',reports:'Reports',stats:'Statistics',settings:'Settings',executive:'Executive management',change_status:'Change status',approve:'Approve stages',notes:'Notes',update_progress:'Update progress',checklist:'Checklists',upload:'Upload files',request:'Request advance',view_own:'Own projects',review:'Review delivery',view_assigned:'Assigned projects'};
const permLabel=c=>(curLang()==='en'?(PERM_LABELS_EN[c]||PERM_LABELS[c]):PERM_LABELS[c])||c;
/* ---------- Role permissions drag & drop ---------- */
let _dragPerm=null;
function dragPerm(ev,p){ _dragPerm=p; try{ev.dataTransfer.setData('text/plain',p);ev.dataTransfer.effectAllowed='copy';}catch(e){} }
function allowPermDrop(ev){ ev.preventDefault(); try{ev.dataTransfer.dropEffect='copy';}catch(e){} const b=ev.currentTarget; b.classList.add('drop-hover'); }
function _readDragPerm(ev){ let p=null; try{p=ev.dataTransfer.getData('text/plain');}catch(e){} return p||_dragPerm; }
function grantPerm(role,p){
  if(!EDITABLE_ROLES.includes(role)||!ALL_PERMS.includes(p)) return;
  const rp=state.rolePerms||(state.rolePerms=defaultRolePerms()); if(!Array.isArray(rp[role])) rp[role]=[...(ROLE[role]?.can||[])];
  if(rp[role].includes(p)){ toast(TR('الصلاحية موجودة في «'+roleLabel(role)+'» مسبقًا','Permission already in “'+roleLabel(role)+'”')); return; }
  rp[role].push(p); saveRolePerms();
  if(session.role===role) renderShell();
  renderSettings(); toast(TR('مُنحت «'+permLabel(p)+'» لدور '+roleLabel(role),'Granted “'+permLabel(p)+'” to '+roleLabel(role)));
}
function dropPermTo(ev,role){ ev.preventDefault(); ev.currentTarget.classList.remove('drop-hover'); const p=_readDragPerm(ev); _dragPerm=null; if(p) grantPerm(role,p); }
function dropPermRemove(ev){ ev.preventDefault(); ev.currentTarget.classList.remove('drop-hover'); _dragPerm=null; }
function removePerm(role,p){
  if(role==='admin'&&ADMIN_LOCKED.includes(p)) return toast(TR('هذه الصلاحية أساسية لمدير النظام ولا يمكن إزالتها','This permission is essential for the system admin and cannot be removed'));
  const rp=state.rolePerms||(state.rolePerms=defaultRolePerms()); if(!Array.isArray(rp[role])) rp[role]=[...(ROLE[role]?.can||[])];
  rp[role]=rp[role].filter(x=>x!==p); saveRolePerms();
  if(session.role===role) renderShell();
  renderSettings(); toast(TR('أُزيلت «'+permLabel(p)+'» من '+roleLabel(role),'Removed “'+permLabel(p)+'” from '+roleLabel(role)));
}
function resetRolePerms(){ confirmBox(TR('استعادة الصلاحيات الافتراضية؟','Restore default permissions?'),TR('سيُعاد تعيين صلاحيات كل الأدوار إلى الوضع الافتراضي للجميع.','All role permissions will be reset to defaults for everyone.'),()=>{ state.rolePerms=defaultRolePerms(); saveRolePerms(); renderShell(); renderSettings(); toast(TR('استُعيدت الصلاحيات الافتراضية','Default permissions restored')); }); }

    <div class="field"><label>${TR('الاسم','Name')}</label><input id="usName" value="${u?escapeHtml(u.name):''}" placeholder="${TR('الاسم الكامل','Full name')}"></div>
    <div class="field"><label>${t('a_email')}</label><input id="usEmail" value="${u?escapeHtml(u.email):''}" placeholder="name@gmail.com"></div>
    <div class="field"><label>${TR('الدور','Role')}</label><select id="usRole">
      <option value="admin" ${u&&u.role==='admin'?'selected':''}>${roleLabel('admin')}</option>
      <option value="super" ${u&&u.role==='super'?'selected':''}>${roleLabel('super')}</option>
      <option value="pm" ${u&&u.role==='pm'?'selected':''}>${roleLabel('pm')}</option>
      <option value="dev" ${!u||u.role==='dev'?'selected':''}>${roleLabel('dev')}</option>
    </select></div>
    <div class="modal-actions"><button class="btn primary" onclick="saveUser(${u?`'${u.id}'`:'null'})">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div></div></div>`;
  setTimeout(()=>{const el=$('#usName');if(el)el.focus();},0);
}
async function saveUser(id){
  const name=$('#usName').value.trim(), email=$('#usEmail').value.trim(), role=$('#usRole').value;
  if(!name)return toast(TR('أدخل الاسم','Enter the name')); if(!email)return toast(TR('أدخل البريد الإلكتروني','Enter the email'));
  if(id){
    const u=userById(id); u.name=name; u.email=email; u.role=role;
    try{ await db.collection('users').doc(id).set({name,email,role,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }catch(e){}
    toast(TR('حُدّث المستخدم','User updated'));
  } else {
    // إضافة مسبقة بالبريد لتحديد الصلاحية قبل أول دخول بحساب Google.
    const existing=state.users.find(u=>u.email.toLowerCase()===email.toLowerCase());
    if(existing){ existing.name=name; existing.role=role; toast(TR('حُدّث المستخدم الموجود','Existing user updated')); }
    else { state.users.push({id:uid('pending'),name,email,role,pending:true}); toast(TR('أُضيف المستخدم','User added')); }
  }
  save(); closeModal(); if(session.userId){renderShell();} renderSettings();
}
function approveUser(id){
  const u=userById(id); if(!u)return;
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>${TR('اعتماد ومنح صلاحية','Approve & grant access')}</h3><div class="m-sub">${escapeHtml(u.name)} · ${escapeHtml(u.email)}</div>
    <div class="field"><label>${TR('الدور الممنوح','Granted role')}</label><select id="apRole">
      <option value="dev" selected>${roleLabel('dev')}</option>
      <option value="pm">${roleLabel('pm')}</option>
      <option value="super">${roleLabel('super')}</option>
      <option value="admin">${roleLabel('admin')}</option>
    </select></div>
    <div class="modal-actions"><button class="btn primary" onclick="confirmApprove('${id}')">${TR('اعتماد ومنح الصلاحية','Approve & grant')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div></div></div>`;
}
async function confirmApprove(id){
  const u=userById(id); if(!u)return; const role=$('#apRole').value;
  u.role=role; u.pending=false;
  try{ await db.collection('users').doc(id).set({role,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }catch(e){ console.warn('approve write failed',e); }
  state.notifications=state.notifications.filter(n=>!(n.type==='join_request'&&n.userId===id));
  save(); updateNotifBadge(); closeModal(); renderSettings(); toast(TR('تم الاعتماد ومنح الصلاحية','Approved and access granted'));
}
function delUser(id){
  const u=userById(id); if(!u)return;
  if(id===session.userId)return toast(TR('لا يمكن حذف حسابك أثناء استخدامه','You can’t delete your own account while using it'));
  const used=state.projects.find(p=>p.pmId===id||p.devIds.includes(id));
  if(used)return toast(TR(`لا يمكن الحذف: مرتبط بمشروع «${used.name}»`,`Can’t delete: linked to project “${used.name}”`));
  const isPend=u.role==='pending';
  confirmBox(isPend?TR('رفض الطلب؟','Reject request?'):TR('حذف المستخدم؟','Delete user?'),escapeHtml(u.name),async()=>{
    state.users=state.users.filter(x=>x.id!==id);
    state.notifications=state.notifications.filter(n=>!(n.type==='join_request'&&n.userId===id));
    try{ await db.collection('users').doc(id).delete(); }catch(e){ console.warn('delete user doc failed',e); }
    save(); updateNotifBadge(); renderSettings(); toast(isPend?TR('رُفض الطلب','Request rejected'):TR('حُذف المستخدم','User deleted'));
  });
}
function renameStage(i,v){if(!v.trim())return;state.stagesTemplate[i].name=v.trim();save();}
function moveStage(i,dir){const j=i+dir;if(j<0||j>=state.stagesTemplate.length)return;const a=state.stagesTemplate;[a[i],a[j]]=[a[j],a[i]];save();renderSettings();}
function delStage(i){if(state.stagesTemplate.length<=2)return toast(TR('يجب إبقاء مرحلتين على الأقل','Keep at least two stages'));confirmBox(TR('حذف المرحلة؟','Delete stage?'),TR('لن تتأثر المشاريع الحالية.','Existing projects won’t be affected.'),()=>{state.stagesTemplate.splice(i,1);save();renderSettings();});}
function addStage(){state.stagesTemplate.push({key:uid('tk'),name:TR('مرحلة جديدة','New stage'),desc:'',defaultChecklist:[TR('مهمة 1','Task 1')]});save();renderSettings();}
function addType(kind){const arr=kind==='proj'?state.projectTypes:state.appTypes;openPrompt(TR('نوع جديد','New type'),TR('أدخل اسم النوع','Enter the type name'),'',v=>{if(v.trim()){arr.push(v.trim());save();renderSettings();}});}
function delType(kind,i){(kind==='proj'?state.projectTypes:state.appTypes).splice(i,1);save();renderSettings();}
function resetAll(){confirmBox(TR('إعادة تعيين كل البيانات؟','Reset all data?'),TR('سيُحذف كل شيء ويعود للحالة الافتراضية.','Everything will be deleted and reset to defaults.'),()=>{localStorage.removeItem(KEY);state=buildSeed();save();toast(TR('أُعيد التعيين','Reset done'));go('dashboard');});}

/* =========================================================
   SEARCH
   ========================================================= */
function onSearch(q){ q=q.trim(); if(q.length<1){if(view.name==='search')go('dashboard');return;} go('search',{q}); }
function renderSearch({q}){
  const ql=q.toLowerCase(); const ps=visibleProjects();
  const hits=[];
  ps.forEach(p=>{
    const pm=userById(p.pmId), devs=p.devIds.map(d=>uName(d)).join(' ');
    if((p.name+' '+p.client+' '+p.appType+' '+(pm?.name||'')+' '+devs).toLowerCase().includes(ql)) hits.push({type:TR('مشروع','Project'),p,label:p.name,sub:p.client});
    p.stages.forEach((s,i)=>{ if(s.name.toLowerCase().includes(ql)) hits.push({type:TR('مرحلة','Stage'),p,si:i,label:s.name,sub:p.name}); });
  });
  $('#view').innerHTML=`
  <div class="page-head"><div><h2>${TR('نتائج البحث','Search results')}</h2><div class="desc">${hits.length} ${TR('نتيجة عن','result(s) for')} «${escapeHtml(q)}»</div></div></div>
  ${hits.length?`<div class="proj-grid">${hits.map(h=>`
    <div class="card proj-card" onclick="${h.si!=null?`go('stage',{pid:'${h.p.id}',si:${h.si}})`:`go('project',{id:'${h.p.id}'})`}">
      <div class="pc-top"><div><div class="pc-name">${escapeHtml(h.label)}</div><div class="pc-client">${escapeHtml(h.sub)}</div></div>
      <span class="role-chip" style="background:var(--accent-tint);color:var(--accent)">${h.type}</span></div></div>`).join('')}</div>`
    :emptyState(TR('لا نتائج مطابقة','No matching results'))}`;
}

/* =========================================================
   MODALS
   ========================================================= */
function closeModal(){$('#modalRoot').innerHTML='';}
function confirmBox(title,sub,onYes){
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>${title}</h3><div class="m-sub">${sub}</div>
    <div class="modal-actions"><button class="btn primary" id="cfmYes">${TR('تأكيد','Confirm')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div></div></div>`;
  $('#cfmYes').onclick=()=>{closeModal();onYes();};
}
function openPrompt(title,label,val,onOk){
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>${title}</h3><div class="field" style="margin-top:14px"><label>${label}</label><input id="pmpInput" value="${escapeHtml(val)}"></div>
    <div class="modal-actions"><button class="btn primary" id="pmpOk">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div></div></div>`;
  const inp=$('#pmpInput');inp.focus();$('#pmpOk').onclick=()=>{const v=inp.value;closeModal();onOk(v);};
}
function openStatusModal(pid){
  const p=projectById(pid);
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>${TR('تغيير حالة المشروع','Change project status')}</h3><div class="m-sub">${escapeHtml(p.name)}</div>
    <div class="field"><label>${TR('الحالة','Status')}</label><select id="stSel">
      <option value="in_progress" ${p.status==='in_progress'?'selected':''}>${statusLabel('in_progress')}</option>
      <option value="paused" ${p.status==='paused'?'selected':''}>${statusLabel('paused')}</option>
      <option value="completed" ${p.status==='completed'?'selected':''}>${statusLabel('completed')}</option>
    </select></div>
    <div class="modal-actions"><button class="btn primary" onclick="saveStatus('${pid}')">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div></div></div>`;
}
function saveStatus(pid){const p=projectById(pid);p.status=$('#stSel').value;const cs=p.stages[p.currentStageIndex];logActivity(p,cs,'تغيير حالة المشروع إلى '+STATUS[p.status].label);pSave(p);closeModal();go('project',{id:pid});toast(TR('حُدّثت الحالة','Status updated'));}

function openProjectModal(){
  const pms=state.users.filter(u=>u.role==='pm'||u.role==='admin');
  const devs=state.users.filter(u=>u.role==='dev');
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>${TR('مشروع جديد','New project')}</h3><div class="m-sub">${TR('سيُنشأ بدورة الحياة الافتراضية','Created with the default lifecycle')} (${state.stagesTemplate.length} ${TR('مرحلة','stages')})</div>
    <div class="field"><label>${TR('اسم التطبيق','Application name')}</label><input id="npName" placeholder="${TR('مثال: تطبيق الحجوزات','e.g. Booking app')}"></div>
    <div class="field"><label>${TR('العميل','Client')}</label><input id="npClient" placeholder="${TR('اسم الجهة','Organization name')}"></div>
    <div class="field"><label>${TR('نوع التطبيق','Application type')}</label><select id="npType">${state.appTypes.map(t=>`<option>${escapeHtml(t)}</option>`).join('')}</select></div>
    <div class="field"><label>${TR('مدير المشروع','Project manager')}</label><select id="npPm">${pms.map(u=>`<option value="${u.id}">${escapeHtml(u.name)}</option>`).join('')}</select></div>
    <div class="field"><label>${TR('المطوّرون (اختياري — اختر بالضغط مع Ctrl)','Developers (optional — Ctrl-click to multi-select)')}</label><select id="npDevs" multiple style="min-height:96px">${devs.map(u=>`<option value="${u.id}">${escapeHtml(u.name)}</option>`).join('')}</select></div>
    <div class="field"><label>${TR('تاريخ التسليم المتوقع','Expected delivery date')}</label><input id="npDue" type="date" value="${todayISO()}"></div>
    <div class="modal-actions"><button class="btn primary" onclick="createProject()">${TR('إنشاء المشروع','Create project')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div></div></div>`;
}
function createProject(){
  const name=$('#npName').value.trim(); if(!name)return toast(TR('أدخل اسم التطبيق','Enter the application name'));
  const devIds=[...$('#npDevs').selectedOptions].map(o=>o.value); // اختياري: يمكن ترك الفريق فارغًا
  const stages=state.stagesTemplate.map((t,i)=>({id:uid('st'),name:t.name,desc:t.desc,ownerId:devIds.length?devIds[i%devIds.length]:null,
    start:i===0?todayISO():null,end:null,plannedDays:3,actualDays:null,status:i===0?'in_progress':'not_started',approved:false,
    checklist:t.defaultChecklist.map(c=>({id:uid('c'),name:c,ownerId:null,done:false,doneDate:null,notes:[]})),notes:[],files:[],activity:[]}));
  markEnhancement(stages);
  const p={id:uid('p'),name,productName:name,cycle:1,client:$('#npClient').value.trim()||'—',appType:$('#npType').value,pmId:$('#npPm').value,devIds,
    startDate:todayISO(),dueDate:$('#npDue').value,status:'in_progress',stages,currentStageIndex:0};
  logActivity(p,stages[0],'إنشاء المشروع وتفعيل المرحلة الأولى');
  state.projects.unshift(p); notify(`إنشاء مشروع جديد «${name}»`,p.id); pSave(p); closeModal(); go('project',{id:p.id}); toast(TR('أُنشئ المشروع','Project created'));
}
/* ---------- تعديل / حذف مشروع ---------- */
function canManageProject(p){ return !!p && (can('create_project')||p.pmId===session.userId); }
function openProjectEditModal(id){
  const p=projectById(id); if(!p) return;
  if(!canManageProject(p)) return toast(t('no_perm'));
  const pms=state.users.filter(u=>u.role==='pm'||u.role==='admin');
  const devs=state.users.filter(u=>u.role==='dev');
  const types=[...new Set([...state.appTypes, p.appType])]; // نضمن ظهور النوع الحالي حتى لو حُذف من القائمة
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>${TR('تعديل المشروع','Edit project')}</h3><div class="m-sub">${TR('تعديل اسم المشروع وبياناته الأساسية','Update the project name and its core details')}</div>
    <div class="field"><label>${TR('اسم التطبيق','Application name')}</label><input id="epName" maxlength="120" value="${escapeHtml(p.name)}"></div>
    <div class="field"><label>${TR('العميل','Client')}</label><input id="epClient" maxlength="120" value="${escapeHtml(p.client||'')}"></div>
    <div class="field"><label>${TR('نوع التطبيق','Application type')}</label><select id="epType">${types.map(tp=>`<option ${tp===p.appType?'selected':''}>${escapeHtml(tp)}</option>`).join('')}</select></div>
    <div class="field"><label>${TR('مدير المشروع','Project manager')}</label><select id="epPm">${pms.map(u=>`<option value="${u.id}" ${u.id===p.pmId?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}</select></div>
    <div class="field"><label>${TR('المطوّرون (اختر بالضغط مع Ctrl)','Developers (Ctrl-click to multi-select)')}</label><select id="epDevs" multiple style="min-height:96px">${devs.map(u=>`<option value="${u.id}" ${p.devIds.includes(u.id)?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}</select></div>
    <div class="field"><label>${TR('تاريخ التسليم المتوقع','Expected delivery date')}</label><input id="epDue" type="date" value="${p.dueDate||''}"></div>
    <div class="modal-actions">
      <button class="btn" style="border-color:var(--rose);color:var(--rose);margin-inline-end:auto" onclick="deleteProject('${id}')">${TR('حذف','Delete')}</button>
      <button class="btn primary" onclick="saveProjectEdit('${id}')">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div>
  </div></div>`;
  setTimeout(()=>{const el=$('#epName');if(el)el.focus();},0);
}
function saveProjectEdit(id){
  const p=projectById(id); if(!p) return;
  if(!canManageProject(p)) return toast(t('no_perm'));
  const name=$('#epName').value.trim(); if(!name) return toast(TR('أدخل اسم التطبيق','Enter the application name'));
  p.name=name;
  if((p.cycle||1)===1) p.productName=name; // مزامنة الاسم الأساسي لمشروع الدورة الأولى
  p.client=$('#epClient').value.trim()||'—';
  p.appType=$('#epType').value;
  p.pmId=$('#epPm').value;
  p.devIds=[...$('#epDevs').selectedOptions].map(o=>o.value);
  p.dueDate=$('#epDue').value||p.dueDate;
  logActivity(p,p.stages[p.currentStageIndex],'تعديل بيانات المشروع');
  pSave(p); closeModal(); go('project',{id}); toast(TR('حُدّث المشروع','Project updated'));
}
function deleteProject(id){
  const p=projectById(id); if(!p) return;
  if(!canManageProject(p)) return toast(t('no_perm'));
  confirmBox(TR('حذف المشروع؟','Delete project?'),
    TR(`سيُحذف مشروع «${escapeHtml(p.name)}» نهائيًا لكل المستخدمين، ولا يمكن التراجع.`,`Project “${escapeHtml(p.name)}” will be permanently deleted for all users. This cannot be undone.`),
    async()=>{
      state.projects=state.projects.filter(x=>x.id!==id); save();
      try{ await db.collection('projects').doc(id).delete(); }catch(e){ console.warn('delete project failed',e); }
      closeModal(); go('projects'); toast(TR('حُذف المشروع','Project deleted'));
    });
}

/* =========================================================
   NOTIFICATIONS
   ========================================================= */
function updateNotifBadge(){const n=state.notifications.filter(x=>!x.read).length;const b=$('#notifBadge');b.textContent=n;b.classList.toggle('hidden',n===0);}
function openNotifs(){const tt=$('#notifTitle');if(tt)tt.textContent=TR('التنبيهات','Notifications');const mk=$('#notifMarkAll');if(mk)mk.textContent=TR('تعليم الكل كمقروء','Mark all read');renderNotifs();$('#notifDrawer').classList.add('open');}
function closeNotifs(){$('#notifDrawer').classList.remove('open');}
function renderNotifs(){
  $('#notifList').innerHTML=state.notifications.length?state.notifications.map(n=>`
    <div class="notif-item ${n.read?'':'unread'}" onclick="openNotif('${n.id}')">
      <div class="ni-ic" style="background:var(--primary-tint);color:var(--primary-ink)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg></div>
      <div><div class="ni-t">${escapeHtml(n.text)}</div><div class="ni-s num">${fmtDateTime(n.ts)}</div></div></div>`).join('')
    :`<div class="empty" style="padding:30px">${TR('لا تنبيهات','No notifications')}</div>`;
}
function openNotif(id){const n=state.notifications.find(x=>x.id===id);if(!n)return;n.read=true;save();updateNotifBadge();closeNotifs();
  if(n.type==='join_request'){ if(can('manage_users')) go('settings'); return; }
  if(n.projectId&&projectById(n.projectId))go('project',{id:n.projectId});}
function markAllRead(){state.notifications.forEach(n=>n.read=true);save();updateNotifBadge();renderNotifs();}

/* =========================================================
   THEME + TOAST + utils
   ========================================================= */
function applyTheme(){document.documentElement.setAttribute('data-theme',state.meta.theme);const dark=state.meta.theme==='dark';$('#themeLabel').textContent=dark?'الوضع الفاتح':'الوضع الليلي';$('#themeIcon').innerHTML=dark?'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>':'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';}
function toggleTheme(){state.meta.theme=state.meta.theme==='dark'?'light':'dark';save();applyTheme();}
function toast(msg){const w=$('#toastWrap');const t=document.createElement('div');t.className='toast';t.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M20 6 9 17l-5-5"/></svg>${escapeHtml(msg)}`;w.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2200);}
function emptyState(t){return`<div class="empty" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 15h5"/></svg><div class="et">${t}</div></div>`;}

/* ---------- boot ---------- */
load();
applyLang();
renderLanding();

auth.getRedirectResult()
  .then(async (result)=>{
    if(result && result.user){
      const u=await ensureFirebaseUser(result.user);
      if(u) doLogin(u.id);
    }
  })
  .catch((e)=>{ console.error(e); authError(friendlyAuthError(e)); });

auth.onAuthStateChanged(async (fbUser)=>{
  if(fbUser){
    const u=await ensureFirebaseUser(fbUser);
    if(u) doLogin(u.id);
  } else {
    session={userId:null,role:null};
  }
});
</script>
