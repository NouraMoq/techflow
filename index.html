<style>
/* ============ TOKENS ============ */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f6f9fb;
  --ink:#0F172A; --muted:#5b6b7b; --faint:#8ea2b3;
  --border:#dbe4ec; --border-strong:#c3d1dd;
  --primary:#3B82F6; --primary-ink:#1D4ED8; --primary-tint:#DBEAFE;
  --accent:#14B8A6; --accent-tint:#CCFBF1;
  --amber:#b45309; --amber-tint:#fbe6cf;
  --rose:#be123c; --rose-tint:#fcdce3;
  --green:#15803d; --green-tint:#d6f0dd;
  --slate:#64748b; --slate-tint:#e5ebf1;
  --shadow:0 1px 2px rgba(13,27,42,.06),0 8px 24px -12px rgba(13,27,42,.18);
  --shadow-sm:0 1px 2px rgba(13,27,42,.08);
  --r:14px; --r-sm:9px; --r-lg:20px;
  --f-ui:"Poppins","Cairo","Segoe UI",Tahoma,"Noto Kufi Arabic","Noto Sans Arabic",system-ui,sans-serif;
  --f-num:"SF Mono","Cascadia Mono",Consolas,"Roboto Mono",monospace;
}
html[data-theme="dark"]{
  --bg:#0a1017; --surface:#111a24; --surface-2:#0d151d;
  --ink:#e8eef4; --muted:#9fb0bf; --faint:#6b7d8c;
  --border:#1f2c39; --border-strong:#2a3947;
  --primary:#60A5FA; --primary-ink:#93C5FD; --primary-tint:#17335c;
  --accent:#2DD4BF; --accent-tint:#0e3a37;
  --amber:#fbbf24; --amber-tint:#3a2a0e;
  --rose:#fb7185; --rose-tint:#3a1520;
  --green:#4ade80; --green-tint:#0f2c1a;
  --slate:#94a3b8; --slate-tint:#1c2530;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:inherit}
::selection{background:var(--primary-tint);color:var(--primary-ink)}
.num{font-family:var(--f-num);font-feature-settings:"tnum";letter-spacing:-.01em}
.hidden{display:none!important}

/* ============ LOGIN ============ */
#login{min-height:100%;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 80% -10%,var(--primary-tint),transparent 60%),var(--bg)}
.login-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow);padding:34px 30px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.brand .mark{width:38px;height:38px;border-radius:11px;background:#fff;overflow:hidden;
  display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.brand .mark svg{width:100%;height:100%}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.brand-alt{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em;margin-top:1px}
.lang-btn{font-weight:800;gap:6px;letter-spacing:.02em}
.bs-names{display:flex;flex-direction:column;line-height:1.05}
.bs-names #brandName{font-weight:800;font-size:15px}
.lang-icon-btn{width:auto!important;gap:5px;padding:0 11px;font-weight:800;font-size:12.5px;letter-spacing:.03em}
.login-card p.lead{color:var(--muted);font-size:13.5px;margin:14px 0 20px}
.user-pick{display:flex;flex-direction:column;gap:9px;max-height:340px;overflow:auto}
.user-btn{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--surface-2);text-align:right;transition:.15s;width:100%}
.user-btn:hover{border-color:var(--primary);background:var(--primary-tint)}
.avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-weight:700;font-size:13px;color:#fff}
.user-btn .meta{flex:1;min-width:0}
.user-btn .meta .nm{font-weight:600;font-size:14px}
.user-btn .meta .rl{font-size:11.5px;color:var(--muted)}
.role-chip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}

/* ============ LANDING ============ */
#landing{min-height:100%;overflow-y:auto;background:var(--bg)}
.lp-nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 28px;
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.lp-nav .brand{margin-bottom:0}
.lp-nav .grow{flex:1}
.nm-logo{display:inline-flex;align-items:center}
.nm-logo img{height:var(--logo-h,36px);width:auto;display:block}
html[data-theme="dark"] .nm-logo{background:#fff;border-radius:11px;padding:4px 10px}
.lp-hero{position:relative;overflow:hidden;padding:66px 28px 54px;text-align:center;
  background:radial-gradient(1100px 520px at 80% -20%,var(--primary-tint),transparent 55%),radial-gradient(900px 480px at 10% 0%,var(--accent-tint),transparent 55%),var(--bg)}
.lp-hero .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--primary-ink);
  background:var(--primary-tint);border:1px solid var(--primary);padding:6px 13px;border-radius:30px;margin-bottom:20px}
.lp-hero h1{font-size:clamp(28px,5vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.15;max-width:820px;margin:0 auto 16px}
.lp-hero h1 .grad{background:linear-gradient(120deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.lp-hero p.sub{font-size:clamp(15px,2.2vw,18px);color:var(--muted);max-width:640px;margin:0 auto 26px;line-height:1.6}
.lp-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn.lg{padding:13px 24px;font-size:15px;border-radius:12px}
.pipeline{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap;margin-top:44px}
.pl-step{display:flex;align-items:center;gap:10px}
.pl-node{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:30px;padding:8px 15px;box-shadow:var(--shadow-sm);font-size:13px;font-weight:600;white-space:nowrap}
.pl-node .n{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.pl-arrow{color:var(--faint);margin:0 4px}
.pl-arrow svg{width:16px;height:16px;display:block}
.lp-section{max-width:1080px;margin:0 auto;padding:56px 28px}
.lp-section h2{font-size:clamp(22px,3.5vw,30px);font-weight:800;letter-spacing:-.02em;text-align:center;margin-bottom:10px}
.lp-section .lead{color:var(--muted);text-align:center;max-width:640px;margin:0 auto 34px;line-height:1.7;font-size:15px}
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center}
@media(max-width:760px){.about-grid{grid-template-columns:1fr}}
.about-txt p{color:var(--muted);line-height:1.85;margin-bottom:14px;font-size:15px}
.about-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow-sm)}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(120deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600}
.lp-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.feature-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;box-shadow:var(--shadow-sm);transition:.18s}
.feature-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.feature-card .fic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px;background:var(--primary-tint);color:var(--primary-ink)}
.feature-card .fic svg{width:22px;height:22px}
.feature-card h3{font-size:16px;font-weight:800;margin-bottom:6px}
.feature-card p{font-size:13.5px;color:var(--muted);line-height:1.6}
.lp-band{background:linear-gradient(120deg,var(--primary),var(--accent));color:#fff;text-align:center;padding:48px 28px;margin-top:20px}
.lp-band h2{font-size:clamp(21px,3vw,28px);font-weight:800;margin-bottom:10px;color:#fff}
.lp-band p{opacity:.9;margin-bottom:22px;font-size:15px}
.btn.on-band{background:#fff;color:var(--primary-ink);border-color:#fff}
.btn.on-band:hover{filter:brightness(.96);color:var(--primary-ink)}
.lp-footer{text-align:center;padding:26px;color:var(--faint);font-size:12.5px;border-top:1px solid var(--border)}
/* ---- marketing landing (Novametrics) ---- */
.lp-links{display:flex;gap:2px;align-items:center;margin-inline-start:8px}
.lp-links button{padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:8px;transition:.15s}
.lp-links button:hover{color:var(--ink);background:var(--surface-2)}
@media(max-width:960px){.lp-links{display:none}}
.hero-wordmark{font-weight:800;letter-spacing:.14em;font-size:clamp(13px,2.4vw,17px);color:var(--primary-ink);margin-bottom:14px}
.vm-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:720px){.vm-grid{grid-template-columns:1fr}}
.vm-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;box-shadow:var(--shadow-sm)}
.vm-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--primary-tint);color:var(--primary-ink);margin-bottom:14px}
.vm-ic svg{width:23px;height:23px}
.vm-label{font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--primary);text-transform:uppercase;margin-bottom:8px}
.vm-card p{color:var(--muted);line-height:1.85;font-size:14.5px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;transition:.18s}
.prod-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.prod-ic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.prod-ic svg{width:24px;height:24px}
.prod-name{font-size:18px;font-weight:800;letter-spacing:-.01em}
.prod-alt{color:var(--muted);font-weight:600;font-size:15px}
.prod-card p{color:var(--muted);line-height:1.7;font-size:14px;flex:1}
.prod-card .btn{align-self:flex-start}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:820px){.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm)}
.step-n{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-family:var(--f-num);
  background:var(--primary-tint);color:var(--primary-ink);margin-bottom:10px}
.step-t{font-weight:800;font-size:15px;margin-bottom:4px}
.step-d{font-size:13px;color:var(--muted);line-height:1.6}
.why-list{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;max-width:900px;margin:0 auto}
@media(max-width:720px){.why-list{grid-template-columns:1fr}}
.why-item{display:flex;align-items:flex-start;gap:11px;font-size:15px;color:var(--ink);line-height:1.6}
.why-ck{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--green-tint);color:var(--green)}
.why-ck svg{width:15px;height:15px}
.cform{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;box-shadow:var(--shadow)}
.cform-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:560px){.cform-grid{grid-template-columns:1fr}}
.cform .field{max-width:none}
.cform-full{grid-column:1/-1}
.cform-msg{font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:9px;margin:4px 0 12px}
.cform-msg.ok{background:var(--green-tint);color:var(--green)}
.cform-msg.err{background:var(--rose-tint);color:var(--rose)}
.lp-foot{border-top:1px solid var(--border);background:var(--surface-2);margin-top:20px}
.lp-foot-top{max-width:1080px;margin:0 auto;padding:34px 28px 20px;display:flex;gap:26px;justify-content:space-between;flex-wrap:wrap}
.lp-foot-tag{color:var(--muted);font-size:13px;margin-top:10px}
.lp-foot-links{display:flex;flex-wrap:wrap;gap:6px 18px;align-content:flex-start;max-width:520px}
.lp-foot-links button{color:var(--muted);font-size:13.5px;font-weight:600;transition:.15s}
.lp-foot-links button:hover{color:var(--primary-ink)}
.lp-foot-bottom{text-align:center;padding:16px;color:var(--faint);font-size:12.5px;border-top:1px solid var(--border)}

/* ============ AUTH ============ */
#auth{display:none;min-height:100%;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 80% -10%,var(--primary-tint),transparent 60%),var(--bg)}
#auth.on{display:grid}
.auth-card{width:min(430px,100%);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow);padding:30px 28px}
.auth-card h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:14px}
.auth-card .a-sub{color:var(--muted);font-size:13.5px;margin:4px 0 20px}
.pw-wrap{position:relative}
.pw-wrap .toggle{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);padding:4px}
.pw-wrap .toggle svg{width:17px;height:17px}
.pw-wrap input{padding-left:38px!important}
.auth-links{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12.5px}
.auth-links button{color:var(--primary-ink);font-weight:600}
.auth-links button:hover{opacity:.8}
.auth-alt{text-align:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.auth-alt button{color:var(--primary-ink);font-weight:700}
.auth-err{background:var(--rose-tint);color:var(--rose);border:1px solid var(--rose);border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;font-weight:600}
.demo-note{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted);margin-top:16px;line-height:1.7}
.demo-note b{color:var(--ink)}
.back-home{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:4px}
.back-home:hover{color:var(--primary-ink)}
.back-home svg{width:14px;height:14px}

/* ============ APP SHELL ============ */
#app{display:none;min-height:100%;grid-template-columns:246px 1fr;grid-template-rows:auto 1fr}
#app.on{display:grid}
.topbar{grid-column:1/3;height:60px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:40}
.topbar .brand-sm{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px}
.topbar .brand-sm .mark{width:30px;height:30px;border-radius:9px;background:#fff;overflow:hidden;display:grid;place-items:center;border:1px solid var(--border)}
.topbar .brand-sm .mark svg{width:100%;height:100%}
.search-wrap{flex:1;max-width:420px;position:relative}
.search-wrap svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.search-wrap input{width:100%;padding:9px 34px 9px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface-2);outline:none;transition:.15s}
.search-wrap input:focus{border-color:var(--primary);background:var(--surface)}
.top-actions{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative;transition:.15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn:disabled{opacity:.32;cursor:default;pointer-events:none}
#backBtn:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.icon-btn svg{width:19px;height:19px}
.badge-dot{position:absolute;top:7px;left:8px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--rose);
  color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.me{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 10px;border-radius:12px;transition:.15s}
.me:hover{background:var(--surface-2)}
.me .nm{font-size:13px;font-weight:600;line-height:1.15}
.me .rl{font-size:11px;color:var(--muted)}

.sidebar{background:var(--surface);border-inline-end:1px solid var(--border);padding:16px 12px;
  display:flex;flex-direction:column;gap:3px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.nav-label{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.06em;padding:12px 12px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--muted);
  font-size:14px;font-weight:600;transition:.15s;text-align:right;width:100%}
.nav-item svg{width:19px;height:19px;flex:0 0 auto}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--primary-tint);color:var(--primary-ink)}
.sidebar .spacer{flex:1}
.theme-toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:var(--muted);font-weight:600;font-size:13.5px}
.theme-toggle:hover{background:var(--surface-2)}

.main{padding:26px 30px 60px;overflow:auto;height:calc(100vh - 60px)}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.page-head .desc{color:var(--muted);font-size:13.5px}
.page-head .grow{flex:1}

/* ============ REUSABLE ============ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:600;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary-ink)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{border-color:transparent;background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm)}

.status-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px}
.status-tag .dot{width:7px;height:7px;border-radius:50%}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;margin-bottom:24px}
/* ---- Launch countdown ---- */
.countdown{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  background:linear-gradient(120deg,var(--primary),var(--accent));color:#fff;border-radius:var(--r-lg);
  padding:20px 24px;margin-bottom:24px;box-shadow:var(--shadow)}
.cd-eyebrow{font-size:15px;font-weight:800;letter-spacing:-.01em}
.cd-date{font-size:13px;opacity:.92;margin-top:6px}
.cd-date b{font-weight:800}
.cd-timer{display:flex;align-items:center;gap:8px;direction:ltr}
.cd-unit{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:12px;
  padding:8px 12px;min-width:62px;text-align:center;backdrop-filter:blur(4px)}
.cd-num{font-size:26px;font-weight:800;line-height:1;letter-spacing:.01em}
.cd-lbl{font-size:11px;opacity:.9;margin-top:5px;font-weight:600}
.cd-sep{font-size:22px;font-weight:800;opacity:.7;align-self:flex-start;margin-top:6px}
.cd-launched{font-size:20px;font-weight:800}
@media(max-width:560px){.countdown{justify-content:center;text-align:center}.cd-timer{justify-content:center}
  .cd-unit{min-width:54px;padding:7px 9px}.cd-num{font-size:22px}}
.kpi{padding:16px 17px;position:relative;overflow:hidden}
.kpi .k-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px}
.kpi .k-ic svg{width:19px;height:19px}
.kpi .k-val{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi .k-lbl{font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:600}
.kpi.clickable{cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.kpi.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.kpi.clickable:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.kpi .k-go{position:absolute;top:14px;left:14px;color:var(--faint);opacity:0;transform:translateX(4px);transition:.18s}
.kpi .k-go svg{width:16px;height:16px}
.kpi.clickable:hover .k-go{opacity:1;transform:translateX(0)}

.charts-row{display:grid;grid-template-columns:320px 1fr;gap:16px;margin-bottom:24px}
.chart-title{font-size:14px;font-weight:700;margin-bottom:2px}
.chart-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.legend{display:flex;flex-direction:column;gap:9px}
.legend-item{display:flex;align-items:center;gap:9px;font-size:13px}
.legend-item .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.legend-item .lg-val{margin-inline-start:auto;font-weight:700;color:var(--muted)}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.bar-row .bn{width:150px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:9px;background:var(--surface-2);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar-row .bp{width:42px;text-align:left;font-size:12.5px;font-weight:700;color:var(--muted)}

/* Projects */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.proj-card{padding:18px;display:flex;flex-direction:column;gap:13px;transition:.18s;cursor:pointer}
.proj-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.proj-card .pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.proj-card .pc-name{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.proj-card .pc-client{font-size:12.5px;color:var(--muted);margin-top:2px}
.pc-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:12.5px}
.pc-meta .mrow{display:flex;flex-direction:column;gap:1px}
.pc-meta .ml{color:var(--faint);font-size:11px}
.pc-meta .mv{font-weight:600}
.pc-stage{display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--surface-2);padding:8px 11px;border-radius:9px}
.pc-stage .idx{width:20px;height:20px;border-radius:6px;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.progress-line{display:flex;align-items:center;gap:10px}
.progress-line .bar-track{height:8px}
.avatars{display:flex}
.avatars .avatar{width:26px;height:26px;font-size:10.5px;border:2px solid var(--surface);margin-inline-start:-8px}
.avatars .avatar:first-child{margin-inline-start:0}

/* filters */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.filters select,.filters input{padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);outline:none}
.filters select:focus,.filters input:focus{border-color:var(--primary)}

/* App detail */
.app-hero{padding:22px 24px;margin-bottom:20px}
.app-hero .ah-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.app-hero h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.app-hero .ah-sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.big-progress{margin-top:18px}
.big-progress .bp-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.big-progress .bp-track{height:13px;background:var(--surface-2);border-radius:20px;overflow:hidden}
.big-progress .bp-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:20px;transition:width .7s cubic-bezier(.2,.8,.2,1)}

.timeline{position:relative;padding-inline-start:8px}
.tl-stage{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:14px}
.tl-stage:not(:last-child)::before{content:"";position:absolute;right:21px;top:38px;bottom:-4px;width:2px;background:var(--border)}
.tl-stage.done:not(:last-child)::before{background:var(--green)}
.tl-node{width:44px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:14px;
  border:2px solid var(--border);background:var(--surface);color:var(--muted);z-index:1}
.tl-stage.done .tl-node{background:var(--green);border-color:var(--green);color:#fff}
.tl-stage.active .tl-node{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-tint)}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 14px;cursor:pointer;transition:.15s;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tl-card:hover{border-color:var(--primary);box-shadow:var(--shadow-sm)}
.tl-stage.active .tl-card{border-color:var(--primary)}
.tl-card .ts-name{font-weight:700;font-size:14.5px}
.tl-card .ts-meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
.tl-card .ts-right{margin-inline-start:auto;display:flex;align-items:center;gap:12px}
.mini-ring{width:34px;height:34px}

/* Stage detail */
.stage-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
@media(max-width:1000px){.stage-grid{grid-template-columns:1fr}}
.panel{padding:18px 20px;margin-bottom:18px}
.panel h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h3 svg{width:17px;height:17px;color:var(--primary)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.info-grid .ig{display:flex;flex-direction:column;gap:2px}
.info-grid .igl{font-size:11.5px;color:var(--faint)}
.info-grid .igv{font-weight:600;font-size:13.5px}

.check-block{padding:9px 0;border-bottom:1px solid var(--border)}
.check-block:last-of-type{border-bottom:none}
.check-item{display:flex;align-items:center;gap:11px}
.check-box{width:21px;height:21px;border-radius:6px;border:2px solid var(--border-strong);display:grid;place-items:center;flex:0 0 auto;transition:.15s;cursor:pointer}
.check-box.on{background:var(--green);border-color:var(--green)}
.check-box svg{width:13px;height:13px;color:#fff;opacity:0;transition:.15s}
.check-box.on svg{opacity:1}
.check-item.done .ci-name{text-decoration:line-through;color:var(--faint)}
.ci-actions{display:flex;gap:1px;opacity:.5;transition:.15s;flex:0 0 auto}
.check-item:hover .ci-actions{opacity:1}
.ci-mini{width:29px;height:29px;border-radius:7px}
.ci-mini svg{width:15px;height:15px}
.add-check{display:flex;gap:8px;margin-top:12px}
.add-check input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);outline:none;transition:.15s}
.add-check input:focus{border-color:var(--primary);background:var(--surface)}
.ci-body{flex:1;min-width:0}
.ci-name{font-size:13.5px;font-weight:600}
.ci-sub{font-size:11.5px;color:var(--muted)}
.ci-notes{margin-inline-start:32px;margin-top:7px;display:flex;flex-direction:column;gap:6px}
.ci-notes:empty{display:none}
.ci-note{background:var(--surface-2);border-radius:9px;border-inline-start:3px solid var(--primary);padding:8px 11px}
.ci-note .cn-head{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.ci-note .cn-nm{font-weight:700;font-size:11.5px}
.ci-note .cn-ts{font-size:10.5px;color:var(--faint);margin-inline-start:auto}
.ci-note .cn-actions{display:flex;gap:1px;opacity:.5}
.ci-note:hover .cn-actions{opacity:1}
.ci-note .cn-text{font-size:12.5px;white-space:pre-wrap;line-height:1.5}
.ci-note-add{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--primary-ink);padding:3px 2px;width:fit-content}
.ci-note-add:hover{opacity:.8}
.enh-box{margin-top:8px;background:var(--primary-tint);border:1px solid var(--primary);border-radius:11px;padding:12px 14px}
.enh-box .enh-t{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;color:var(--primary-ink);margin-bottom:4px}
.enh-box .enh-s{font-size:12px;color:var(--primary-ink);opacity:.85;margin-bottom:10px;line-height:1.5}

.note{padding:12px 14px;background:var(--surface-2);border-radius:10px;margin-bottom:10px;border-inline-start:3px solid var(--primary)}
.note .n-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.note .n-head .nm{font-weight:700;font-size:12.5px}
.note .n-head .ts{font-size:11px;color:var(--faint);margin-inline-start:auto}
.note .n-text{font-size:13.5px;white-space:pre-wrap}
.composer{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.composer textarea{width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface-2);resize:vertical;outline:none;line-height:1.5}
.composer textarea:focus{border-color:var(--primary);background:var(--surface)}

.file-item{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border)}
.file-item:last-child{border-bottom:none}
.file-ic{width:34px;height:34px;border-radius:8px;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.file-ic svg{width:17px;height:17px}
.file-item .fn{font-weight:600;font-size:13px}
.file-item .fs{font-size:11px;color:var(--muted)}
.dropzone{border:2px dashed var(--border-strong);border-radius:11px;padding:16px;text-align:center;color:var(--muted);
  font-size:13px;margin-top:8px;transition:.15s}
.dropzone:hover{border-color:var(--primary);color:var(--primary-ink)}

.log-item{display:flex;gap:11px;padding:8px 0;font-size:12.5px}
.log-item .ld{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex:0 0 auto}
.log-item .lt{color:var(--muted);font-size:11px}
.log-item .lx{color:var(--ink)}

.advance-box{padding:16px 18px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--border-strong)}
.advance-req{display:flex;align-items:center;gap:9px;font-size:13px;margin-bottom:8px}
.advance-req .rq{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto}
.advance-req .rq.ok{background:var(--green);color:#fff}
.advance-req .rq.no{background:var(--slate-tint);color:var(--faint)}
.advance-req .rq svg{width:12px;height:12px}

/* Reports */
.report-table{width:100%;border-collapse:collapse;font-size:13px}
.report-table th{text-align:right;font-size:11.5px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--border);white-space:nowrap}
.report-table td{padding:11px 12px;border-bottom:1px solid var(--border)}
.report-table tr:hover td{background:var(--surface-2)}
.mini-bar{height:7px;width:90px;background:var(--surface-2);border-radius:20px;overflow:hidden;display:inline-block;vertical-align:middle}
.mini-bar span{display:block;height:100%;border-radius:20px}

/* Settings */
.set-section{margin-bottom:26px}
.set-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-row .sr-handle{color:var(--faint);cursor:grab}
.set-row input.stage-name{flex:1;padding:7px 10px;border:1px solid transparent;border-radius:8px;background:transparent}
.set-row input.stage-name:hover{background:var(--surface-2)}
.set-row input.stage-name:focus{border-color:var(--primary);background:var(--surface);outline:none}
.chip-input{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;font-size:12.5px}
.chip button{color:var(--faint)}
.color-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.color-row input[type=color]{width:34px;height:34px;border:none;border-radius:8px;background:none;cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-width:380px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);outline:none}
.field textarea{resize:vertical;min-height:80px;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}

/* ============ EXECUTIVE / BUSINESS MODEL ============ */
.exec-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.exec-tab{padding:10px 16px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
.exec-tab:hover{color:var(--ink)}
.exec-tab.active{color:var(--primary-ink);border-bottom-color:var(--primary)}
.exec-cat-sel{padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);outline:none}
.bmc{display:grid;gap:12px;grid-template-columns:repeat(5,minmax(0,1fr));
  grid-template-areas:"kp ka vp cr cs" "kp kr vp ch cs" "cost cost rev rev rev"}
.bmc-kp{grid-area:kp}.bmc-ka{grid-area:ka}.bmc-kr{grid-area:kr}.bmc-vp{grid-area:vp}
.bmc-cr{grid-area:cr}.bmc-ch{grid-area:ch}.bmc-cs{grid-area:cs}.bmc-cost{grid-area:cost}.bmc-rev{grid-area:rev}
.bmc-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px;min-height:130px}
.bmc-vp{border-color:var(--amber);background:var(--amber-tint)}
.bmc-h{display:flex;align-items:center;gap:8px}
.bmc-ic{font-size:16px;line-height:1}
.bmc-t{font-weight:800;font-size:13.5px;flex:1;line-height:1.3}
.bmc-n{font-size:11px;color:var(--faint);background:var(--surface-2);border-radius:20px;padding:1px 8px}
.bmc-desc{font-size:11.5px;color:var(--faint);line-height:1.5}
.bmc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.bmc-chip{font-size:12px}
.bmc-add{padding:3px 9px!important;font-size:11.5px!important;border-style:dashed}
@media(max-width:920px){.bmc{grid-template-columns:1fr 1fr;grid-template-areas:none}.bmc>*{grid-area:auto!important}}
@media(max-width:560px){.bmc{grid-template-columns:1fr}}
.exec-table td{vertical-align:middle}
.exec-file{display:flex;gap:12px;align-items:flex-start}
.exec-file-ic{width:44px;height:44px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;
  background:var(--primary-tint);color:var(--primary-ink)}
/* ---- Kanban (ClickUp-style) ---- */
.tv-toggle{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.tv-btn{padding:7px 12px;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface)}
.tv-btn.active{background:var(--primary-tint);color:var(--primary-ink)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:860px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.kanban{grid-template-columns:1fr}}
.kb-col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px;transition:.15s}
.kb-col.drop-hover{border-color:var(--primary);background:var(--primary-tint)}
.kb-head{display:flex;align-items:center;gap:8px;padding:2px 4px}
.kb-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.kb-title{font-weight:800;font-size:13.5px;flex:1}
.kb-count{font-size:11px;color:var(--faint);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 8px}
.kb-list{display:flex;flex-direction:column;gap:8px;min-height:20px}
.kb-empty{font-size:12px;color:var(--faint);text-align:center;padding:14px 0}
.kb-card{position:relative;display:flex;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;transition:.15s}
.kb-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.kb-card.dragging{opacity:.5}
.kb-prio{width:4px;flex:0 0 auto}
.kb-card-body{padding:9px 11px;flex:1;min-width:0}
.kb-card-title{font-weight:700;font-size:13.5px;line-height:1.4;word-break:break-word}
.kb-card-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kb-card-meta{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.kb-tag{font-size:10.5px;font-weight:700;padding:1px 7px;border:1px solid;border-radius:20px}
.kb-due{font-size:11px;color:var(--muted)}
.kb-due.over{color:var(--rose);font-weight:700}
.kb-add{margin-top:2px;padding:7px;border:1px dashed var(--border-strong);border-radius:9px;color:var(--muted);
  font-size:12.5px;font-weight:700;background:transparent;transition:.15s}
.kb-add:hover{border-color:var(--primary);color:var(--primary-ink);background:var(--primary-tint)}
/* ---- Finance ---- */
.fin-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media(max-width:760px){.fin-cards{grid-template-columns:1fr}}
.fin-sum{padding:16px 18px}

<script>
/* =========================================================

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

const dateLocale = ()=> (typeof curLang==='function'&&curLang()==='en')?'en-US':'ar-SA-u-nu-latn';
const fmtDate = d=> d? new Date(d).toLocaleDateString(dateLocale(),{year:'numeric',month:'short',day:'numeric'}) : '—';

const escapeHtml = s => (s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Status meta ---------- */

const ALL_PERMS=['create_project','edit_stages','manage_users','assign_dev','view_all','reports','stats','settings','executive','change_status','approve','review','notes','update_progress','checklist','upload','request','view_own','view_assigned'];

const defaultRolePerms = () => ({ admin:[...ROLE.admin.can], pm:[...ROLE.pm.can], dev:[...ROLE.dev.can], super:[...ROLE.super.can] });
const rolePermsOf = r => (state && state.rolePerms && state.rolePerms[r]) || ROLE[r]?.can || [];
const can = p => rolePermsOf(session.role).includes(p);
// صلاحية إدارة القسم التنفيذي: صلاحية «executive» المخصّصة، أو «settings» (مدير النظام) دون الحاجة لهجرة بيانات

/* ---------- App state ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyCRzEoV0ujoyMpKuHPRhLm0sgBB6wCXSTo",

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

const db = firebase.firestore();

let state, session={userId:null,role:null}, view={name:'dashboard',params:{}}, navStack=[];

/* ---------- Seed data ---------- */
const DEFAULT_STAGES = [
  ['التخطيط ودراسة الجدوى','مرحلة تأسيسية تُحدَّد فيها أهداف المشروع ونطاقه، وتُدرَس جدواه التقنية والزمنية والمالية قبل الالتزام بالموارد، لضمان قرار مدروس بالمضي قدمًا. (مرحلة تمهيدية مضافة قبل دورة الـ SDLC)',['تحديد نطاق المشروع وأهدافه','دراسة الجدوى التقنية والزمنية والتكلفة','تقدير الموارد والجدول الزمني','اعتماد المضي قدمًا']],
  ['جمع المتطلبات وتحليلها','تُكتشَف فيها احتياجات العميل وتُحلَّل متطلبات أصحاب المصلحة الوظيفية وغير الوظيفية، وتُوثَّق كقصص مستخدم واضحة تُشكِّل المرجع الأساسي لبقية المراحل.',['اكتشاف احتياجات العميل','تحليل متطلبات أصحاب المصلحة','توثيق قصص المستخدم (User Stories)','اعتماد وثيقة المتطلبات']],
  ['التصميم المعماري','تُحدَّد فيها بنية الحل التقنية عبر تخطيط الوحدات وقواعد البيانات وواجهات الربط (APIs) ومسارات تدفق البيانات، بما يضمن حلًّا قابلًا للتوسّع والصيانة.',['تحديد بنية الحل','تخطيط الوحدات وقواعد البيانات وواجهات APIs','تحديد تدفق البيانات','مراجعة واعتماد التصميم']],
  ['البرمجة والبناء','تُترجَم فيها التصاميم المعتمدة إلى شيفرة برمجية قابلة للتنفيذ وفق معايير وأنماط موحّدة، مع مراجعة الكود لضمان الجودة والاتساق.',['كتابة الكود وبناء المكوّنات','الالتزام بمعايير وأنماط البرمجة','تحويل التصميم إلى برامج قابلة للتنفيذ','مراجعة الكود (Code Review)']],
  ['ضمان الجودة والاختبار','تُنفَّذ فيها اختبارات الوحدة والتكامل واختبار القبول (UAT) لاكتشاف العيوب والتحقق من مطابقة السلوك للمتطلبات قبل الإطلاق.',['تنفيذ الاختبارات لاكتشاف العيوب','اختبارات الوحدة والتكامل و UAT','التحقق من السلوك المتوقع','إغلاق العيوب الحرجة']],
  ['النشر والإطلاق','يُطلَق فيها البرنامج إلى بيئة الإنتاج ويُتاح للمستخدمين، مع إدارة انتقال سلس والتحقق من استقرار النظام بعد النشر مباشرة.',['إطلاق البرنامج إلى بيئة الإنتاج','إتاحة الوصول للمستخدمين (Go-Live)','ضمان انتقال سلس دون انقطاع','التحقق بعد النشر']],

];
const AVATAR_COLORS=['#0f766e','#0891b2','#7c3aed','#be123c','#b45309','#15803d','#2563eb','#db2777'];
const avColor = id => AVATAR_COLORS[[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%AVATAR_COLORS.length];
const initials = n => escapeHtml(n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join(''));
const MAINT_STAGE='التشغيل والصيانة';

/* lightweight local password hash (salted cyrb53) — prototype only, NOT production-grade.
   Real deployment must hash & verify on the server (see Tier-2 backend). */
function hashPw(pw,salt){
  let h1=0xdeadbeef^salt.length, h2=0x41c6ce57^salt.length; const s=salt+'\u0000'+(pw||'');
  for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507); h1^=Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}

  if(d.model&&typeof d.model==='object')e.model=d.model;
  if(Array.isArray(d.followup))e.followup=d.followup;

/* ---------- Projects sync (Firestore = shared source of truth) ---------- */
let _projUnsub=null;
function stripProject(p){ return {...p, stages:(p.stages||[]).map(s=>({...s, files:(s.files||[]).map(f=>{const{dataUrl,...m}=f;return m;})}))}; } // نحذف dataUrl (قد يتجاوز حد مستند Firestore)
function saveProject(p){ if(!p||typeof p.id!=='string'||!p.id) return; try{ return db.collection('projects').doc(p.id).set(stripProject(p)); }catch(e){ console.warn('project sync failed',e); } }
function pSave(p){ save(); saveProject(p); } // حفظ محلي + مزامنة المشروع للسحابة
function _mergeLocalFiles(docs){ // نُبقي روابط الملفات المحلية (dataUrl) للجلسة الحالية بعد المزامنة
  const byId={}; (state.projects||[]).forEach(p=>byId[p.id]=p);
  docs.forEach(sp=>{ const lp=byId[sp.id]; if(lp)(sp.stages||[]).forEach(st=>{const lst=(lp.stages||[]).find(x=>x.id===st.id); if(lst)(st.files||[]).forEach(f=>{const lf=(lst.files||[]).find(x=>x.id===f.id); if(lf&&lf.dataUrl&&!f.dataUrl)f.dataUrl=lf.dataUrl;});}); });
  return docs;
}
function _projectsFromSnap(snap){ // إزالة التكرار بالمعرّف
  const map=new Map(); snap.forEach(d=>{ const pr=d.data()||{}; const id=(typeof pr.id==='string'&&pr.id)?pr.id:d.id; if(id) map.set(id,{...pr,id}); });
  return [...map.values()];
}
async function loadProjects(){
  try{
    const snap=await db.collection('projects').get();
    const map=new Map(); _projectsFromSnap(snap).forEach(p=>map.set(p.id,p));
    // ترحيل المشاريع المحلية القديمة مرّة واحدة فقط لكل متصفح (يمنع إعادة الرفع والتضخّم)
    if(!localStorage.getItem('tf_projects_migrated')){
      for(const p of (state.projects||[])){ if(p && typeof p.id==='string' && p.id && !map.has(p.id)){ map.set(p.id,p); try{ await db.collection('projects').doc(p.id).set(stripProject(p)); }catch(e){} } }
      try{ localStorage.setItem('tf_projects_migrated','1'); }catch(e){}
    }
    state.projects=_mergeLocalFiles([...map.values()]).map(normalizeProject); save();
  }catch(e){ console.warn('loadProjects failed',e); }
}
function subscribeProjects(){
  if(_projUnsub) return;
  try{
    _projUnsub=db.collection('projects').onSnapshot(snap=>{
      state.projects=_mergeLocalFiles(_projectsFromSnap(snap)).map(normalizeProject); save();
      if(session.userId && ['dashboard','projects','project','stage','reports','search'].includes(view.name)){
        try{ go(view.name, view.params, false); }catch(e){}
      }
    }, err=>console.warn('projects listener error',err));
  }catch(e){ console.warn('subscribeProjects failed',e); }
}
function unsubscribeProjects(){ if(_projUnsub){ try{_projUnsub();}catch(e){} _projUnsub=null; } }

/* ---------- Derived helpers ---------- */
const userById = id => state.users.find(u=>u.id===id);
const uName = id => { const u=userById(id); return u ? u.name : 'مستخدم'; }; // آمن: لا ينهار إن لم يُحمّل المستخدم بعد
const projectById = id => state.projects.find(p=>p.id===id);
function normalizeProject(p){
  if(!p||typeof p!=='object') return p;
  p.devIds=Array.isArray(p.devIds)?p.devIds:[];
  p.stages=Array.isArray(p.stages)?p.stages:[];
  if(typeof p.currentStageIndex!=='number') p.currentStageIndex=0;
  p.status=p.status||'in_progress';
  p.stages.forEach(s=>{ if(!s||typeof s!=='object') return;
    s.checklist=Array.isArray(s.checklist)?s.checklist:[];
    s.notes=Array.isArray(s.notes)?s.notes:[];
    s.files=Array.isArray(s.files)?s.files:[];
    s.activity=Array.isArray(s.activity)?s.activity:[];
    s.checklist.forEach(c=>{ if(c&&typeof c==='object') c.notes=Array.isArray(c.notes)?c.notes:[]; });
  });
  return p;
}
function stageProgress(s){ const cl=(s&&Array.isArray(s.checklist))?s.checklist:[]; if(!cl.length) return s&&s.status==='completed'?100:0;
  return Math.round(cl.filter(c=>c.done).length / cl.length *100); }
function projectProgress(p){
  const st=(p&&Array.isArray(p.stages))?p.stages:[]; const n=st.length; if(!n) return 0;
  let done=0;
  st.forEach((s,i)=>{ if(i<p.currentStageIndex || s.status==='completed') done+=1; else if(i===p.currentStageIndex) done+=stageProgress(s)/100; });
  return Math.round(done/n*100);
}
function isDelayed(p){ return p.status!=='completed' && p.dueDate < todayISO(); }
function effectiveStatus(p){ if(p.status==='completed')return'completed'; if(p.status==='paused')return'paused'; return isDelayed(p)?'delayed':'in_progress'; }
function visibleProjects(){
  if(can('view_all')) return state.projects;
  if(session.role==='pm') return state.projects.filter(p=>p.pmId===session.userId);
  if(session.role==='dev') return state.projects.filter(p=>p.devIds.includes(session.userId));
  return [];
}
function canAdvance(p,idx){ const s=p.stages[idx]; return s.checklist.every(c=>c.done) && s.approved; }

function submitContact(){
  const gv=id=>($('#'+id)?.value||'').trim();
  const name=gv('cfName'), org=gv('cfOrg'), email=gv('cfEmail'), phone=gv('cfPhone'), type=gv('cfType'), desc=gv('cfDesc');
  const msg=$('#cfMsg');
  const show=(txt,ok)=>{ if(!msg)return; msg.textContent=txt; msg.className='cform-msg '+(ok?'ok':'err'); msg.style.display='block'; };
  if(!name) return show(TR('يرجى إدخال الاسم.','Please enter your name.'),false);
  if(!org)  return show(TR('يرجى إدخال اسم الجهة.','Please enter the organization name.'),false);
  if(!EMAIL_RE.test(email)) return show(TR('يرجى إدخال بريد إلكتروني صحيح.','Please enter a valid email.'),false);
  if(!desc) return show(TR('يرجى إدخال وصف مختصر للاحتياج.','Please add a short description of your need.'),false);
  /* === TODO (backend): no submission endpoint is wired yet ===
     Replace the console.log below with a real submission, e.g.:
       fetch('/api/contact', { method:'POST', headers:{'Content-Type':'application/json'},
         body: JSON.stringify({ name, org, email, phone, type, desc }) })
     or an email/form service (Formspree, EmailJS, a Firebase Cloud Function, etc.). */
  console.log('[contact] pending submission →', { name, org, email, phone, type, desc });
  ['cfName','cfOrg','cfEmail','cfPhone','cfDesc'].forEach(id=>{ const el=$('#'+id); if(el)el.value=''; });
  show(TR('تم استلام طلبك بنجاح — سنتواصل معكم قريبًا.','Your request was received — we’ll get back to you soon.'),true);
}

function friendlyAuthError(e){
  const code=e?.code||'';
  const map={
    'auth/unauthorized-domain':'الدومين الحالي غير مضاف في Firebase Authentication > Settings > Authorized domains. أضيفي novametrics.sa وtechflow-5f24a.web.app وأي دومين تستخدمينه.',
    'auth/operation-not-allowed':'طريقة الدخول غير مفعّلة في Firebase Authentication. فعّلي Email/Password وGoogle من Sign-in method.',
    'auth/popup-blocked':'المتصفح منع نافذة Google. سنحاول فتح التسجيل بطريقة التحويل.',
    'auth/popup-closed-by-user':'أُغلقت نافذة Google قبل إكمال الدخول.',
    'auth/email-already-in-use':'هذا البريد مسجل مسبقًا. استخدمي تسجيل الدخول أو استعادة كلمة المرور.',
    'auth/invalid-email':'صيغة البريد الإلكتروني غير صحيحة.',
    'auth/weak-password':'كلمة المرور ضعيفة. استخدمي 6 أحرف على الأقل.',
    'auth/wrong-password':'كلمة المرور غير صحيحة.',
    'auth/user-not-found':'لا يوجد حساب بهذا البريد. أنشئي حسابًا جديدًا أولًا.',
    'auth/invalid-credential':'بيانات الدخول غير صحيحة أو انتهت صلاحيتها. جرّبي مرة أخرى.',
    'auth/network-request-failed':'تعذر الاتصال بالشبكة. تحققي من الإنترنت ثم أعيدي المحاولة.',
    'auth/api-key-not-valid':'مفتاح Firebase API غير مقبول. تحققي من أن firebaseConfig من نفس مشروع techflow-5f24a، وأن قيود مفتاح API في Google Cloud تسمح بدومين Firebase Hosting وخدمة Identity Toolkit API.'
  };
  return map[code] || ('تعذر إكمال العملية: ' + (e?.message||code||'خطأ غير معروف'));
}
async function loginWithGoogle(){
  try{
    await auth.signInWithPopup(provider);
  }catch(e){
    console.error(e);
    if(e.code==='auth/popup-blocked' || e.code==='auth/popup-closed-by-user' || e.code==='auth/cancelled-popup-request'){
      try{ await auth.signInWithRedirect(provider); return; }
      catch(e2){ console.error(e2); authError(friendlyAuthError(e2)); return; }
    }
    authError(friendlyAuthError(e));
  }
}
async function registerWithEmail(){
  const name=($('#authName')?.value||'').trim();
  const email=($('#authEmail')?.value||'').trim();
  const pass=$('#authPass')?.value||'';
  if(!name) return authError(TR('أدخلي الاسم.','Enter your name.'));
  if(!EMAIL_RE.test(email)) return authError(TR('أدخلي بريدًا إلكترونيًا صحيحًا.','Enter a valid email.'));
  if(pass.length<6) return authError(TR('كلمة المرور يجب ألا تقل عن 6 أحرف.','Password must be at least 6 characters.'));
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    try{ await cred.user.updateProfile({displayName:name}); }catch(e){}
    await ensureFirebaseUser(cred.user,{name});
  }catch(e){ console.error(e); authError(friendlyAuthError(e)); }
}
async function loginWithEmail(){
  const email=($('#authEmail')?.value||'').trim();
  const pass=$('#authPass')?.value||'';
  if(!EMAIL_RE.test(email)) return authError(TR('أدخلي بريدًا إلكترونيًا صحيحًا.','Enter a valid email.'));
  if(!pass) return authError(TR('أدخلي كلمة المرور.','Enter your password.'));
  try{ await auth.signInWithEmailAndPassword(email,pass); }
  catch(e){ console.error(e); authError(friendlyAuthError(e)); }
}
async function resetPassword(){
  const email=($('#authEmail')?.value||'').trim();
  if(!EMAIL_RE.test(email)) return authError(TR('أدخلي بريدًا إلكترونيًا صحيحًا.','Enter a valid email.'));
  try{ await auth.sendPasswordResetEmail(email); toast(TR('تم إرسال رابط استعادة كلمة المرور إلى البريد.','A password reset link was sent to your email.')); showAuth('login'); }
  catch(e){ console.error(e); authError(friendlyAuthError(e)); }
}
async function ensureFirebaseUser(fbUser,extra={}){
  if(!fbUser) return null;
  let local=userById(fbUser.uid);
  const email=(fbUser.email||extra.email||'').trim();
  const pendingByEmail = state.users.find(u=>u.email && email && u.email.toLowerCase()===email.toLowerCase() && u.pending);
  if(pendingByEmail){
    pendingByEmail.id=fbUser.uid; pendingByEmail.pending=false; pendingByEmail.name=extra.name||pendingByEmail.name||fbUser.displayName||email; pendingByEmail.photoURL=fbUser.photoURL||'';
    save(); local=pendingByEmail;
    try{ await db.collection('users').doc(fbUser.uid).set({id:fbUser.uid,name:local.name,email,role:local.role,photoURL:local.photoURL,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }catch(e){}
  }
  let snap=null;
  try{ snap=await db.collection('users').doc(fbUser.uid).get(); }catch(e){ console.warn('Firestore user read failed',e); }
  if(snap && snap.exists){
    const d=snap.data();
    const role=d.role || local?.role || 'dev';
    local={id:fbUser.uid,name:extra.name||d.name||fbUser.displayName||email,role,email:d.email||email,photoURL:fbUser.photoURL||''};
    const ix=state.users.findIndex(u=>u.id===local.id);
    if(ix>=0) state.users[ix]={...state.users[ix],...local,role}; else state.users.push({...local,role});
    save(); return userById(fbUser.uid);
  }
  // أول مستخدم على الإطلاق يصبح مدير النظام (تأسيس)، وأي مسجّل بعده يكون "بانتظار الموافقة" حتى يعتمده مدير النظام
  let role='pending';
  try{ const any=await db.collection('users').limit(1).get(); if(any.empty) role='admin'; }catch(e){ if(!state.users.some(u=>u.role==='admin')) role='admin'; }
  local={id:fbUser.uid,name:extra.name||fbUser.displayName||email,role,email,photoURL:fbUser.photoURL||''};
  const ix=state.users.findIndex(u=>u.id===local.id || (u.email&&email&&u.email.toLowerCase()===email.toLowerCase()));
  if(ix>=0) state.users[ix]={...state.users[ix],...local}; else state.users.push(local);
  save();
  try{ await db.collection('users').doc(fbUser.uid).set({...local,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }catch(e){ console.warn('Firestore user write failed',e); }
  return userById(fbUser.uid);
}
async function ensureGoogleUser(fbUser){ return ensureFirebaseUser(fbUser); }

/* مزامنة كل المستخدمين من Firestore وتوليد إشعار لمدير النظام بطلبات الانضمام المعلّقة */
async function syncUsersForAdmin(){
  if(!can('manage_users')) return;
  try{
    const snap=await db.collection('users').get();
    snap.forEach(doc=>{ const d=doc.data(); const uid2=d.id||doc.id;
      const rec={id:uid2,name:d.name||d.email||'مستخدم',email:d.email||'',role:d.role||'dev',photoURL:d.photoURL||''};
      const ix=state.users.findIndex(u=>u.id===uid2);
      if(ix>=0) state.users[ix]={...state.users[ix],...rec}; else state.users.push(rec);
    });
    state.notifications = state.notifications.filter(n=>n.type!=='join_request');
    state.users.filter(u=>u.role==='pending').forEach(u=>{
      state.notifications.unshift({id:'jr_'+u.id,type:'join_request',userId:u.id,text:`طلب انضمام جديد: ${u.name} (${u.email}) — بانتظار منحه صلاحية`,ts:Date.now(),read:false});
    });
    save(); updateNotifBadge();
    if(view.name==='settings') renderSettings();
  }catch(e){ console.warn('admin users sync failed',e); }
}

  if(push && view && view.name && view.name!==name){

  }

}

/* =========================================================
   LAUNCH COUNTDOWN (العد التنازلي لإطلاق الشركة)
   ========================================================= */
let _countdownTimer=null;
function launchTargetMs(){ const d=(state.meta&&state.meta.launchDate)||'2026-08-20'; return new Date(d+'T00:00:00').getTime(); }
function countdownParts(){
  const diff=launchTargetMs()-Date.now();
  if(diff<=0) return {done:true,d:0,h:0,m:0,s:0};
  const s=Math.floor(diff/1000);
  return {done:false,d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60};
}
function countdownHTML(){
  const d=(state.meta&&state.meta.launchDate)||'2026-08-20';
  const loc=curLang()==='ar'?'ar-SA-u-nu-latn':'en-US';
  const dateLbl=new Date(d+'T00:00:00').toLocaleDateString(loc,{year:'numeric',month:'long',day:'numeric'});
  const unit=(id,lbl)=>`<div class="cd-unit"><div class="cd-num num" id="cd-${id}">--</div><div class="cd-lbl">${lbl}</div></div>`;
  return `<div class="countdown" id="countdown">
    <div class="cd-info">
      <div class="cd-eyebrow">🚀 ${t('cd_title')}</div>
      <div class="cd-date">${t('cd_target')} <b>${dateLbl}</b></div>
    </div>
    <div class="cd-timer" id="cdTimer">
      ${unit('d',t('cd_day'))}<span class="cd-sep">:</span>${unit('h',t('cd_hour'))}<span class="cd-sep">:</span>${unit('m',t('cd_min'))}<span class="cd-sep">:</span>${unit('s',t('cd_sec'))}
    </div>
  </div>`;
}
function tickCountdown(){
  const box=$('#countdown'); if(!box){ stopCountdown(); return; }
  const p=countdownParts();
  if(p.done){ const el=$('#cdTimer'); if(el)el.innerHTML=`<div class="cd-launched">${t('cd_launched')}</div>`; stopCountdown(); return; }
  const set=(id,v)=>{const el=$('#cd-'+id); if(el)el.textContent=String(v).padStart(2,'0');};
  set('d',p.d); set('h',p.h); set('m',p.m); set('s',p.s);
}
function startCountdown(){ stopCountdown(); if(!$('#countdown'))return; tickCountdown(); _countdownTimer=setInterval(tickCountdown,1000); }
function stopCountdown(){ if(_countdownTimer){ clearInterval(_countdownTimer); _countdownTimer=null; } }
function attnRow(p){const es=effectiveStatus(p);return`
  <div class="bar-row" style="cursor:pointer" onclick="go('project',{id:'${p.id}'})">
    <div class="bn">${escapeHtml(p.name)}</div>

    <div class="grow" style="flex:1"></div>
    <div class="bp num" style="width:auto;color:var(--muted)">${TR('تسليم','Due')} ${fmtDate(p.dueDate)}</div>
  </div>`;
}
function donutSVG(dist,total){
  const r=52,c=2*Math.PI*r; let off=0; const sum=dist.reduce((a,d)=>a+d.n,0)||1;
  const segs=dist.map(d=>{const frac=d.n/sum;const len=frac*c;const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="var(${state.statusColors[d.k]})" stroke-width="18" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s;}).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="18"/>${segs}
    <text x="70" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)" font-family="var(--f-num)">${total}</text>
    <text x="70" y="86" text-anchor="middle" font-size="11" fill="var(--muted)">${TR('مشروع','projects')}</text></svg>`;
}

/* ---------- Stage actions ---------- */
function toggleCheck(pid,si,ci){
  const p=projectById(pid),s=p.stages[si],c=s.checklist[ci];
  c.done=!c.done; c.doneDate=c.done?todayISO():null; c.ownerId=c.ownerId||session.userId;
  logActivity(p,s,`${c.done?'إكمال':'إلغاء إكمال'} مهمة: ${c.name}`);
  pSave(p); renderStage({pid,si});
}
function addCheckItem(pid,si){
  const inp=$('#newCheckItem'); const val=inp?inp.value.trim():''; if(!val)return toast(TR('اكتب اسم العنصر أولًا','Type an item name first'));
  const p=projectById(pid),s=p.stages[si];
  s.checklist.push({id:uid('c'),name:val,ownerId:s.ownerId||null,done:false,doneDate:null,notes:[]});
  logActivity(p,s,`إضافة عنصر لقائمة التحقق: ${val}`);
  save(); saveProject(p); renderStage({pid,si}); toast(t('added'));
}
function editCheckItem(pid,si,ci){
  const p=projectById(pid),s=p.stages[si],c=s.checklist[ci];
  openPrompt(TR('تعديل العنصر','Edit item'),TR('اسم عنصر قائمة التحقق','Checklist item name'),c.name,v=>{ v=(v||'').trim(); if(!v)return;
    c.name=v; logActivity(p,s,`تعديل عنصر قائمة التحقق: ${v}`); pSave(p); renderStage({pid,si}); toast(t('updated')); });
}
function delCheckItem(pid,si,ci){
  const p=projectById(pid),s=p.stages[si],c=s.checklist[ci];
  confirmBox(TR('حذف العنصر؟','Delete item?'),escapeHtml(c.name),()=>{ s.checklist.splice(ci,1);

}

/* ---------- Open a new product lifecycle (major enhancements) ---------- */
function openNewLifecycle(pid){
  const p=projectById(pid); const nextCycle=(p.cycle||1)+1; const base=p.productName||p.name;
  confirmBox(TR('فتح دورة حياة جديدة للمنتج؟','Open a new product lifecycle?'),
    TR(`سيُنشأ مشروع جديد «${escapeHtml(base)} — دورة ${nextCycle}» بدورة حياة كاملة تبدأ من التخطيط، مع الاحتفاظ بالعميل والفريق. الدورة الحالية تبقى كما هي كسجل.`,`A new project “${escapeHtml(base)} — cycle ${nextCycle}” will be created with a full lifecycle starting from planning, keeping the client and team. The current cycle stays as a record.`),
    ()=>spawnLifecycle(pid));
}
function spawnLifecycle(pid){
  const src=projectById(pid); const base=src.productName||src.name; const cycle=(src.cycle||1)+1;
  const stages=state.stagesTemplate.map((t,i)=>({id:uid('st'),name:t.name,desc:t.desc,ownerId:src.devIds[i%src.devIds.length]||null,
    start:i===0?todayISO():null,end:null,plannedDays:3,actualDays:null,status:i===0?'in_progress':'not_started',approved:false,
    checklist:t.defaultChecklist.map(c=>({id:uid('c'),name:c,ownerId:null,done:false,doneDate:null,notes:[]})),notes:[],files:[],activity:[]}));
  const np={id:uid('p'),name:`${base} — دورة ${cycle}`,productName:base,cycle,client:src.client,appType:src.appType,pmId:src.pmId,devIds:[...src.devIds],
    startDate:todayISO(),dueDate:todayISO(),status:'in_progress',stages,currentStageIndex:0};
  markEnhancement(np.stages);
  logActivity(np,np.stages[0],`فتح دورة حياة جديدة (دورة ${cycle}) بناءً على تحسينات جوهرية`);
  state.projects.unshift(np); notify(`فتح دورة حياة جديدة للمنتج «${base}» (دورة ${cycle})`,np.id);
  save(); saveProject(np); closeModal(); go('project',{id:np.id}); toast(TR('أُنشئت دورة حياة جديدة','New lifecycle created'));
}

function uploadFiles(ev,pid,si){
  const p=projectById(pid),s=p.stages[si]; const files=[...ev.target.files];
  let pending=files.length;
  files.forEach(file=>{
    const rec={id:uid('f'),name:file.name,type:file.type,size:file.size,ts:Date.now(),uploaderId:session.userId,dataUrl:null};
    if(file.size<800*1024){const rd=new FileReader();rd.onload=()=>{rec.dataUrl=rd.result;finish();};rd.readAsDataURL(file);}
    else finish();
    function finish(){s.files.unshift(rec);logActivity(p,s,`رفع ملف: ${file.name}`);notify(`ملف جديد في «${p.name}» — ${s.name}`,p.id);if(--pending===0){pSave(p);renderStage({pid,si});toast(TR('تم رفع الملفات','Files uploaded'));}}
  });
}
function approveStage(pid,si){
  const p=projectById(pid),s=p.stages[si]; s.approved=true;
  logActivity(p,s,'اعتماد المرحلة من مدير المشروع'); notify(`اعتماد مرحلة «${s.name}» في «${p.name}»`,p.id);
  save(); saveProject(p); renderStage({pid,si}); toast(TR('اعتُمدت المرحلة','Stage approved'));
}
function requestAdvance(pid,si){
  const p=projectById(pid),s=p.stages[si];
  logActivity(p,s,'طلب الانتقال للمرحلة التالية'); notify(`طلب انتقال في «${p.name}» — ${s.name} بانتظار الاعتماد`,p.id);
  save(); saveProject(p); toast(TR('أُرسل الطلب لمدير المشروع','Request sent to the project manager'));
}
function advanceStage(pid,si){
  const p=projectById(pid),s=p.stages[si];
  if(!canAdvance(p,si))return toast(TR('لا يمكن الانتقال قبل الإكمال والاعتماد','Cannot advance before completion and approval'));
  s.status='completed'; s.end=todayISO(); s.actualDays=s.start?Math.max(1,daysBetween(s.start,s.end)):s.plannedDays;
  logActivity(p,s,'إغلاق المرحلة والانتقال');
  const nx=p.stages[si+1]; p.currentStageIndex=si+1; nx.status='in_progress'; nx.start=todayISO();
  logActivity(p,nx,'تفعيل المرحلة تلقائيًا'); notify(`بدء مرحلة جديدة «${nx.name}» في «${p.name}»`,p.id);
  save(); saveProject(p); go('project',{id:pid}); toast(TR('تم الانتقال للمرحلة التالية','Advanced to the next stage'));
}
function finishProject(pid){
  const p=projectById(pid),s=p.stages[p.currentStageIndex];
  s.status='completed'; s.end=todayISO(); p.status='completed';
  logActivity(p,s,'الاعتماد النهائي وإغلاق المشروع'); notify(`اكتمل المشروع «${p.name}» 🎉`,p.id);
  save(); saveProject(p); go('project',{id:pid}); toast(TR('اكتمل المشروع','Project completed'));
}

/* =========================================================
   REPORTS
   ========================================================= */
function renderReports(){
  const ps=visibleProjects();
  // stage duration analytics across projects
  const stageAgg={}; // name -> {planned,actual,count,delays}
  ps.forEach(p=>p.stages.forEach(s=>{
    if(s.actualDays==null)return; const k=s.name; stageAgg[k]=stageAgg[k]||{planned:0,actual:0,count:0,delay:0};
    stageAgg[k].planned+=s.plannedDays; stageAgg[k].actual+=s.actualDays; stageAgg[k].count++;
    if(s.actualDays>s.plannedDays)stageAgg[k].delay++;
  }));
  const stageRows=Object.entries(stageAgg).map(([n,v])=>({n,avgP:(v.planned/v.count),avgA:(v.actual/v.count),over:v.actual-v.planned,delayRate:v.delay/v.count}));
  const mostDelayed=[...stageRows].sort((a,b)=>b.over-a.over).slice(0,5);
  // developer performance
  const devAgg={};
  ps.forEach(p=>p.devIds.forEach(d=>{devAgg[d]=devAgg[d]||{done:0,active:0,projects:0};devAgg[d].projects++;}));
  ps.forEach(p=>p.stages.forEach(s=>{if(s.ownerId&&devAgg[s.ownerId]){if(s.status==='completed')devAgg[s.ownerId].done++;else if(s.status==='in_progress')devAgg[s.ownerId].active++;}}));
  const onTime = (()=>{let t=0,o=0;ps.forEach(p=>p.stages.forEach(s=>{if(s.actualDays!=null){t++;if(s.actualDays<=s.plannedDays)o++;}}));return t?Math.round(o/t*100):0;})();
  const avgProg = ps.length?Math.round(ps.reduce((a,p)=>a+projectProgress(p),0)/ps.length):0;

  $('#view').innerHTML=`
  <div class="page-head"><div><h2>${TR('التقارير والتحليلات','Reports & analytics')}</h2><div class="desc">${TR('مؤشرات الأداء عبر','Performance indicators across')} ${ps.length} ${TR('مشروع','projects')}</div></div>
    <div class="grow"></div>

function exportCSV(){
  const ps=visibleProjects(); const rows=[[TR('المشروع','Project'),TR('العميل','Client'),TR('النوع','Type'),TR('مدير المشروع','Project manager'),TR('الحالة','Status'),TR('نسبة الإنجاز','Progress'),TR('المرحلة الحالية','Current stage'),TR('البداية','Start'),TR('التسليم','Delivery')]];
  ps.forEach(p=>rows.push([p.name,p.client,p.appType,userById(p.pmId)?.name||'',statusLabel(effectiveStatus(p)),projectProgress(p)+'%',p.stages[p.currentStageIndex]?.name||'',p.startDate,p.dueDate]));
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a');

}
